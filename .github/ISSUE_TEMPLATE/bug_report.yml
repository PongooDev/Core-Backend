name: Bug report
description: Something in the lobby, locker, shop, quests, stats or admin panel doesn't work
body:
  - type: dropdown
    id: build
    attributes:
      label: Fortnite build
      options:
        - "1.1"
        - "1.2"
        - "1.7.2"
        - "1.8"
        - "1.8.1"
        - "1.8.2"
        - "1.9"
        - "1.9.1"
        - "1.10"
        - "1.11"
        - "2.1"
        - "2.2"
        - "2.3"
        - "2.4"
        - "2.4.2"
        - "2.5"
        - "3.0"
        - "3.1"
        - "3.1.1"
        - "3.2"
        - "3.3"
        - "3.5.1"
        - "3.5.2"
        - "3.6"
        - "4.0"
        - "4.1"
        - "4.2"
        - "4.4.0"
        - "4.4.1"
        - "4.4.2"
        - Not about a build (admin panel, launcher sign-in...)
        - Other (say which below)
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Where
      options:
        - Battle Royale
        - Save the World
        - Admin panel
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what should have happened
      description: Screenshots help, especially of any error message.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      placeholder: "1. Open the Item Shop\n2. ..."
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Drag the files in. Bugs with logs get fixed much faster.
        - Your game log: `%LOCALAPPDATA%\FortniteGame\Saved\Logs\FortniteGame.log`
        - The backend's console output around the time it happened (copy and paste it here)
        - Are you on the PC running the backend, or playing from another PC?
