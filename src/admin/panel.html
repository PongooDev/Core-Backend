<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Core Admin</title>
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230078f2'/%3E%3Cpath d='M21 11.5a6 6 0 1 0 0 9' fill='none' stroke='%23fff' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    /* Today's Epic launcher and store: dark neutral surfaces, white Inter text, bold condensed headings, rounded cards
     with hairline borders, Epic blue for the main action. Works offline too (system fonts stand in). */
    :root {
      color-scheme: dark;
      --bg: #121212;
      --sidebar: #121212;
      --surface: #202020;
      --surface-2: #2a2a2a;
      --surface-3: #343434;
      --field: #161616;
      --line: rgba(255, 255, 255, .08);
      --line-strong: rgba(255, 255, 255, .16);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, .62);
      --faint: rgba(255, 255, 255, .42);
      --blue: #0078f2;
      --blue-hover: #268ef5;
      --blue-soft: rgba(0, 120, 242, .16);
      --good: #3ccf6e;
      --warn: #f5b13d;
      --bad: #ef4444;
      --amber: #ffca3a;
      --r-c: #9aa3ad;
      --r-uc: #5fc23b;
      --r-r: #3a96ff;
      --r-vr: #b45cf2;
      --r-sr: #f5a03a;
      --radius: 12px;
      --radius-sm: 8px;
      --sans: "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      --display: "Barlow Condensed", "Bahnschrift SemiBold Condensed", "Bahnschrift", "Roboto Condensed", "Arial Narrow", sans-serif;
      --mono: "Cascadia Mono", Consolas, ui-monospace, monospace;
      font-family: var(--sans);
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
      overflow-x: clip;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    select {
      font: inherit;
      color: inherit;
    }

    a {
      color: #fff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    code,
    .mono {
      font-family: var(--mono);
      font-size: 12px;
    }

    .muted {
      color: var(--muted);
    }

    h1,
    h2,
    .display {
      font-family: var(--display);
      font-weight: 800;
      font-stretch: 75%;
      letter-spacing: .01em;
      margin: 0;
      line-height: 1.05;
    }

    h1 {
      font-size: 40px;
    }

    h2 {
      font-size: 22px;
    }

    h3 {
      margin: 0;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* App shell: a left sidebar, the page beside it */
    .shell {
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 20px 14px;
      background: var(--sidebar);
      border-right: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 10px 18px;
      color: #fff;
    }

    .brand:hover {
      text-decoration: none;
    }

    .brand .mark {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      background: var(--blue);
      flex: none;
    }

    .brand .word {
      font-family: var(--display);
      font-weight: 800;
      font-stretch: 75%;
      font-size: 26px;
      line-height: 1;
      letter-spacing: .02em;
    }

    .brand .word span {
      color: var(--muted);
      font-weight: 600;
      margin-left: 5px;
    }

    nav.nav {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    nav.nav a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      color: var(--muted);
      font-weight: 600;
      font-size: 14px;
    }

    nav.nav a:hover {
      color: #fff;
      background: rgba(255, 255, 255, .05);
      text-decoration: none;
    }

    nav.nav a[aria-current="page"] {
      color: #fff;
      background: rgba(255, 255, 255, .1);
    }

    nav.nav svg {
      width: 20px;
      height: 20px;
      flex: none;
    }

    .server {
      margin-top: auto;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      min-width: 0;
    }

    .server #server-line {
      overflow-wrap: anywhere;
    }

    .pulse {
      width: 8px;
      height: 8px;
      margin-top: 4px;
      border-radius: 50%;
      background: var(--good);
      flex: none;
      box-shadow: 0 0 0 0 rgba(60, 207, 110, .6);
      animation: pulse 2s infinite;
    }

    .pulse.down {
      background: var(--bad);
      animation: none;
    }

    @keyframes pulse {
      70% {
        box-shadow: 0 0 0 8px rgba(60, 207, 110, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(60, 207, 110, 0);
      }
    }

    main {
      width: 100%;
      max-width: 1440px;
      margin: 0 auto;
      padding: 32px 36px 48px;
      min-width: 0;
    }

    .view-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .view-head .muted {
      margin-top: 6px;
    }

    /* Cards */
    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px;
      min-width: 0;
    }

    .panel+.panel,
    .grid+.panel,
    .tiles+.panel {
      margin-top: 16px;
    }

    .grid>.panel+.panel {
      margin-top: 0;
    }

    .panel .panel {
      background: var(--surface-2);
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .panel-head a {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .grid.cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .grid.cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 38px;
      padding: 0 16px;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      cursor: pointer;
      white-space: nowrap;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: .01em;
      background: var(--surface-3);
      color: #fff;
      transition: background-color .12s, border-color .12s, opacity .12s;
    }

    .btn:hover {
      background: #404040;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn.primary {
      background: var(--blue);
    }

    .btn.primary:hover {
      background: var(--blue-hover);
    }

    .btn.ghost {
      background: transparent;
      border-color: var(--line-strong);
    }

    .btn.ghost:hover {
      background: rgba(255, 255, 255, .07);
      border-color: rgba(255, 255, 255, .3);
    }

    .btn.danger {
      background: rgba(239, 68, 68, .14);
      border-color: rgba(239, 68, 68, .45);
      color: #ff8a8a;
    }

    .btn.danger:hover {
      background: var(--bad);
      border-color: var(--bad);
      color: #fff;
    }

    .btn.small {
      min-height: 30px;
      padding: 0 11px;
      font-size: 13px;
      border-radius: 7px;
    }

    .btn:disabled {
      opacity: .45;
      cursor: default;
    }

    .btn:disabled:hover {
      background: var(--surface-3);
    }

    .btn.primary:disabled:hover {
      background: var(--blue);
    }

    .btn:focus-visible,
    a:focus-visible,
    input:focus-visible,
    select:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    /* Inputs */
    .field {
      min-height: 38px;
      padding: 7px 12px;
      background: var(--field);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      color: var(--text);
      min-width: 0;
      transition: border-color .12s, box-shadow .12s;
    }

    .field::placeholder {
      color: var(--faint);
    }

    .field:hover {
      border-color: rgba(255, 255, 255, .26);
    }

    .field:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px var(--blue-soft);
      outline: none;
    }

    .field.num {
      width: 120px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .field.tiny {
      width: 80px;
      min-height: 30px;
      padding: 3px 8px;
      text-align: right;
      border-radius: 7px;
    }

    select.field {
      padding-right: 28px;
    }

    label.check {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: var(--muted);
    }

    label.check input {
      accent-color: var(--blue);
      width: 16px;
      height: 16px;
    }

    /* Switch toggle */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
      flex: none;
      cursor: pointer;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: rgba(255, 255, 255, .14);
      border: 1px solid var(--line-strong);
      transition: background-color .15s, border-color .15s;
      border-radius: 999px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background: #fff;
      transition: transform .15s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 50%;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .4);
    }

    .switch input:checked+.slider {
      background: var(--blue);
      border-color: var(--blue);
    }

    .switch input:focus-visible+.slider {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    .switch input:checked+.slider:before {
      transform: translateX(20px);
    }

    .switch input:disabled+.slider {
      opacity: .4;
      cursor: default;
    }

    /* Stat tiles */
    .tiles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    .tile {
      padding: 16px 18px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      min-width: 0;
    }

    .panel .tile {
      background: var(--surface-2);
    }

    .tile .label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }

    .tile .value {
      font-size: 30px;
      font-weight: 700;
      line-height: 1.15;
      margin-top: 6px;
      letter-spacing: -.01em;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }

    .tile .value small {
      font-size: 15px;
      color: var(--muted);
      font-weight: 500;
      margin-left: 4px;
    }

    .tile.accent {
      background: linear-gradient(135deg, rgba(0, 120, 242, .3), rgba(0, 120, 242, .06) 70%), var(--surface);
      border-color: rgba(0, 120, 242, .45);
    }

    .tile.vbucks .value {
      color: #9fd0ff;
    }

    .tile.text .value {
      font-size: 20px;
      line-height: 1.3;
    }

    .tile .value .sub {
      display: block;
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
      margin-top: 2px;
    }

    /* Pills */
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: rgba(255, 255, 255, .08);
      color: var(--muted);
      white-space: nowrap;
    }

    button.chip {
      border: none;
      outline: none;
      box-shadow: none;
      cursor: pointer;
      font-family: inherit;
    }

    .chip.good {
      color: #6ee59a;
      background: rgba(60, 207, 110, .14);
    }

    .chip.warn {
      color: var(--warn);
      background: rgba(245, 177, 61, .14);
    }

    .chip.bad {
      color: #ff9b9b;
      background: rgba(239, 68, 68, .18);
    }

    .chip.sky {
      color: #79b8ff;
      background: var(--blue-soft);
    }

    .chip.yellow {
      color: var(--amber);
      background: rgba(255, 202, 58, .14);
    }

    .chip.removable {
      cursor: pointer;
      transition: background-color .15s, color .15s;
      user-select: none;
      text-decoration: none;
    }

    .chip.removable .remove-x {
      display: none;
      margin-left: 4px;
      font-weight: 700;
      font-size: 11px;
      line-height: 1;
    }

    .chip.removable:hover {
      color: #ff9b9b;
      background: rgba(239, 68, 68, .22);
    }

    .chip.removable:hover .remove-x {
      display: inline-block;
    }

    /* Tables */
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 11px 14px;
      text-align: left;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
      vertical-align: middle;
    }

    th {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      background: rgba(255, 255, 255, .03);
      position: sticky;
      top: 0;
    }

    tbody tr {
      transition: background-color .1s;
    }

    tbody tr:hover {
      background: rgba(255, 255, 255, .035);
    }

    tr:last-child td {
      border-bottom: 0;
    }

    td.num,
    th.num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    td.wrap {
      white-space: normal;
    }

    td .actions {
      flex-wrap: nowrap;
    }

    td a {
      font-weight: 600;
    }

    .empty {
      padding: 40px 16px;
      text-align: center;
      color: var(--muted);
    }

    .empty h2 {
      color: #fff;
      margin-bottom: 8px;
    }

    /* Rarity */
    .rarity {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 10px;
      background: var(--r-c);
      flex: none;
    }

    .rarity.uc {
      background: var(--r-uc);
    }

    .rarity.r {
      background: var(--r-r);
    }

    .rarity.vr {
      background: var(--r-vr);
    }

    .rarity.sr {
      background: var(--r-sr);
    }

    .item-name {
      display: inline-flex;
      align-items: center;
      font-weight: 600;
    }

    .item-name .tid {
      margin-left: 10px;
      color: var(--faint);
      font-weight: 400;
    }

    /* Players view */
    .players {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }

    .roster {
      position: sticky;
      top: 24px;
      max-height: calc(100vh - 48px);
      display: flex;
      flex-direction: column;
      padding: 16px;
    }

    .roster .field {
      width: 100%;
    }

    .roster .list {
      list-style: none;
      margin: 10px -8px 0;
      padding: 0;
      overflow-y: auto;
    }

    .roster .list button {
      width: 100%;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 0 12px;
      align-items: center;
      padding: 9px 10px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
      text-align: left;
    }

    .roster .list button:hover {
      background: rgba(255, 255, 255, .05);
    }

    .roster .list button[aria-current="true"] {
      background: rgba(255, 255, 255, .1);
    }

    .avatar {
      grid-row: span 2;
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      font-weight: 700;
      font-size: 15px;
      background: linear-gradient(140deg, #0078f2, #6a3bd8);
      color: #fff;
    }

    .roster .name {
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .roster .sub {
      grid-column: 2 / -1;
      color: var(--faint);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4a4a4a;
    }

    .dot.on {
      background: var(--good);
      box-shadow: 0 0 0 3px rgba(60, 207, 110, .18);
    }

    .hero-head {
      display: flex;
      gap: 18px;
      align-items: center;
      flex-wrap: wrap;
    }

    .hero-head .avatar {
      width: 64px;
      height: 64px;
      font-size: 26px;
      grid-row: auto;
    }

    .hero-head .who {
      flex: 1;
      min-width: 220px;
    }

    .hero-head .who code {
      display: block;
      margin-top: 4px;
    }

    .hero-head .chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .subtabs {
      display: flex;
      gap: 22px;
      margin: 20px 0 20px;
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
    }

    .subtabs button {
      border: 0;
      background: transparent;
      cursor: pointer;
      padding: 10px 0;
      color: var(--muted);
      font-weight: 600;
      font-size: 14px;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }

    .subtabs button:hover {
      color: #fff;
    }

    .subtabs button[aria-selected="true"] {
      color: #fff;
      border-bottom-color: #fff;
    }

    .subtabs button .count {
      display: inline-block;
      min-width: 22px;
      margin-left: 6px;
      padding: 0 6px;
      border-radius: 999px;
      font-size: 11px;
      line-height: 18px;
      text-align: center;
      background: rgba(255, 255, 255, .1);
      color: var(--muted);
    }

    .bar {
      height: 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .08);
      overflow: hidden;
    }

    .bar>div {
      height: 100%;
      border-radius: 999px;
      background: var(--blue);
    }

    .bar.rest>div {
      background: linear-gradient(90deg, #6a3bd8, #a77bff);
    }

    .balance {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px 12px;
      align-items: center;
      padding: 16px;
      border-radius: var(--radius);
      background: var(--surface-2);
      border: 1px solid var(--line);
    }

    .balance .label {
      font-weight: 600;
      color: var(--muted);
    }

    .balance .row {
      grid-column: 1 / -1;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    .balance .amount {
      font-size: 24px;
      font-weight: 700;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .filters {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .filters button {
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      background: transparent;
      padding: 5px 14px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      color: var(--muted);
    }

    .filters button:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, .3);
    }

    .filters button[aria-pressed="true"] {
      background: #fff;
      color: #121212;
      border-color: #fff;
    }

    .catalog {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .card {
      --rarity: var(--r-c);
      position: relative;
      text-align: left;
      cursor: pointer;
      padding: 14px 14px 12px 18px;
      min-height: 92px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: linear-gradient(135deg, color-mix(in srgb, var(--rarity) 22%, transparent), transparent 65%), var(--surface-2);
      overflow: hidden;
      transition: border-color .12s, transform .12s;
    }

    .card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--rarity);
    }

    .card:hover {
      border-color: rgba(255, 255, 255, .28);
      transform: translateY(-1px);
    }

    .card.uc {
      --rarity: var(--r-uc);
    }

    .card.r {
      --rarity: var(--r-r);
    }

    .card.vr {
      --rarity: var(--r-vr);
    }

    .card.sr {
      --rarity: var(--r-sr);
    }

    .card[aria-pressed="true"] {
      border-color: var(--blue);
      box-shadow: 0 0 0 2px var(--blue);
    }

    .card .t {
      font-weight: 700;
      line-height: 1.25;
      padding-right: 74px;
    }

    .card .s {
      font-size: 11px;
      color: var(--faint);
      margin-top: 6px;
      overflow-wrap: anywhere;
    }

    .card .k {
      position: absolute;
      right: 10px;
      top: 10px;
      padding: 1px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--muted);
      background: rgba(0, 0, 0, .35);
    }

    .quick {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 8px;
    }

    .quick .btn {
      justify-content: flex-start;
    }

    .shields {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 12px;
    }

    .shield {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-2);
    }

    .shield .lvl {
      font-family: var(--display);
      font-weight: 800;
      font-stretch: 75%;
      font-size: 52px;
      line-height: 1;
      margin-top: 8px;
    }

    .shield .lvl small {
      font-size: 22px;
      color: var(--muted);
      font-weight: 600;
    }

    .pips {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 4px;
      margin: 12px 0;
    }

    .pips span {
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .1);
    }

    .pips span.on {
      background: var(--blue);
    }

    .danger-zone {
      border-color: rgba(239, 68, 68, .35);
    }

    .panel .danger-zone {
      background: linear-gradient(135deg, rgba(239, 68, 68, .1), transparent 60%), var(--surface-2);
    }

    .danger-zone h2 {
      color: #ff9b9b;
    }

    .panel>h2+.note,
    .panel>h2+p {
      margin-top: 6px;
    }

    .option-row {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      margin: 12px 0 16px;
    }

    .log {
      height: calc(100vh - 380px);
      min-height: 280px;
      overflow-y: auto;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.6;
      background: #0b0b0b;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 0;
    }

    .log div {
      padding: 0 14px;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .log div:hover {
      background: rgba(255, 255, 255, .03);
    }

    .log .t {
      color: #6b6b6b;
    }

    .log .c {
      color: #9fd0ff;
    }

    .log .HTTP {
      color: #cfcfcf;
    }

    .log .XMPP {
      color: #c4a5ff;
    }

    .log .Matchmaking {
      color: #7ee2a2;
    }

    .log .World,
    .log .MCP {
      color: #ffd479;
    }

    #toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: min(440px, calc(100% - 32px));
      padding: 12px 16px;
      border-radius: 10px;
      background: var(--surface-3);
      border: 1px solid var(--line-strong);
      box-shadow: 0 16px 40px rgba(0, 0, 0, .55);
      font-weight: 500;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .15s, transform .15s;
      pointer-events: none;
    }

    #toast::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--good);
      flex: none;
    }

    #toast.show {
      opacity: 1;
      transform: none;
    }

    #toast.error::before {
      background: var(--bad);
    }

    .note {
      color: var(--muted);
      font-size: 13px;
    }

    /* In-window Modal Dialog */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .72);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
      opacity: 0;
      transition: opacity .15s ease-out;
    }

    .modal-backdrop.show {
      opacity: 1;
    }

    .modal-dialog {
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      padding: 24px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 48px rgba(0, 0, 0, .6);
      transform: scale(.95);
      transition: transform .15s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-backdrop.show .modal-dialog {
      transform: scale(1);
    }

    .modal-dialog h2 {
      font-size: 18px;
      font-weight: 700;
      margin: 0;
    }

    .modal-dialog p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      margin: 10px 0 16px;
    }

    .modal-dialog .field-wrap {
      margin-bottom: 20px;
    }

    .modal-dialog .field-wrap label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .modal-dialog .actions {
      justify-content: flex-end;
      gap: 8px;
    }

    @media (max-width: 1100px) {
      .players {
        grid-template-columns: minmax(0, 1fr);
      }

      .roster {
        position: static;
        max-height: 380px;
      }
    }

    @media (max-width: 980px) {

      .grid.cols-2,
      .grid.cols-3 {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    @media (max-width: 860px) {
      .shell {
        grid-template-columns: minmax(0, 1fr);
      }

      .sidebar {
        position: sticky;
        top: 0;
        z-index: 10;
        height: auto;
        flex-direction: row;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .brand {
        padding: 0 6px 0 0;
      }

      .brand .word span {
        display: none;
      }

      nav.nav {
        flex-direction: row;
        overflow-x: auto;
        scrollbar-width: none;
        min-width: 0;
      }

      nav.nav a {
        padding: 8px 10px;
        flex: none;
      }

      .server {
        margin: 0 0 0 auto;
        padding: 0;
        background: none;
        border: 0;
      }

      .server #server-line {
        display: none;
      }

      main {
        padding: 20px 16px 40px;
      }

      h1 {
        font-size: 32px;
      }
    }

    @media (max-width: 560px) {
      nav.nav a span {
        display: none;
      }

      .subtabs {
        flex-wrap: nowrap;
        overflow-x: auto;
        scrollbar-width: none;
        gap: 18px;
      }

      .subtabs button {
        flex: none;
      }

      .tiles {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .tile .value {
        font-size: 24px;
      }

      .panel {
        padding: 16px;
      }
    }
  </style>
</head>

<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#/dashboard" aria-label="Core Admin home">
        <span class="mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff"
            stroke-width="2.8" stroke-linecap="round">
            <path d="M17 7.5a6.5 6.5 0 1 0 0 9" />

      <nav class="nav" aria-label="Sections">

            stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">
            <rect x="3.5" y="3.5" width="7" height="7" rx="2" />
            <rect x="13.5" y="3.5" width="7" height="7" rx="2" />

            <path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5" />

          </svg><span>Players</span></a>
        <a href="#/sessions" data-view="sessions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.8" stroke-linecap="round" aria-hidden="true">

            <rect x="3.5" y="13.5" width="17" height="6.5" rx="2" />
            <path d="M7.5 7.25h.01M7.5 16.75h.01M11 7.25h5M11 16.75h5" />

        <a href="#/reports" data-view="reports"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"

            <line x1="4" y1="22" x2="4" y2="15" />
          </svg><span>Reports</span></a>
        <a href="#/shop" data-view="shop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" />
            <line x1="3" y1="6" x2="21" y2="6" />
            <path d="M16 10a4 4 0 0 1-8 0" />
          </svg><span>Shop</span></a>
        <a href="#/logs" data-view="logs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="2.5" />
            <path d="m7 9.5 3 2.5-3 2.5M12.5 15h4.5" />
          </svg><span>Logs</span></a>
        <a href="#/settings" data-view="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />

      </nav>
      <div class="server" title="Backend status"><span class="pulse" id="pulse"></span><span
          id="server-line">Connecting…</span></div>
    </aside>
    <main id="view" aria-live="polite"></main>
  </div>
  <div id="toast" role="status"></div>

  <script>
    "use strict";
    const $ = (id) => document.getElementById(id);
    const state = {
      view: "dashboard", accounts: [], account: null, accountId: null, tab: "overview", inventoryProfile: "items",
      inventoryCategory: "", inventorySearch: "", inventoryPage: 0, inventoryGrouped: null, catalog: { search: "", category: "", items: [], categories: [], picked: null },
      logs: [], logAfter: 0, logPaused: false, logFilter: "", logCategory: "", timers: []
    };

    function el(tag, props = {}, ...children) {
      const node = document.createElement(tag);
      for (const [key, value] of Object.entries(props ?? {})) {
        if (value === undefined || value === null || value === false) continue;
        if (key === "class") node.className = value;
        else if (key === "text") node.textContent = value;
        else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
        else if (key in node && typeof value !== "string") node[key] = value;
        else node.setAttribute(key, value === true ? "" : value);
      }
      for (const child of children.flat(Infinity)) if (child !== null && child !== undefined && child !== false) node.append(child instanceof Node ? child : String(child));
      return node;
    }
    const btn = (label, onclick, kind = "", extra = {}) => el("button", { type: "button", class: `btn ${kind}`, onclick, ...extra }, el("span", { text: label }));
    const chip = (label, kind = "") => el("span", { class: `chip ${kind}` }, el("span", { text: label }));
    const toggleSwitch = (checked, onchange, disabled = false) => {
      const input = el("input", {
        type: "checkbox", checked: Boolean(checked), disabled: Boolean(disabled),
        onchange: (e) => onchange(e.target.checked)
      });
      const slider = el("span", { class: "slider" });
      return el("label", { class: "switch" }, input, slider);
    };
    const fmt = (number) => Number(number ?? 0).toLocaleString();
    const kinds = {
      heroes: "Heroes", schematics: "Schematics", survivors: "Survivors", leads: "Lead survivors", defenders: "Defenders", llamas: "Llamas",
      vouchers: "Vouchers", resources: "Resources", consumables: "Consumables", transform: "Transform keys", expeditions: "Expeditions",
      stormshields: "Storm shields", skilltree: "Skill tree", banners: "Banners", quests: "Quests", world: "Backpack and storage", other: "Other"
    };
    const kindLabel = (key) => kinds[key] ?? key;

    async function api(path, body, method) {
      const options = body === undefined && !method ? undefined : {
        method: method || "POST",
        headers: { "Content-Type": "application/json" },
        body: body !== undefined && method !== "GET" && method !== "DELETE" ? JSON.stringify(body) : undefined
      };
      const response = await fetch(path, options);
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.errorMessage ?? `${response.status} ${response.statusText}`);
      return data;
    }

    let toastTimer;
    function toast(message, error = false) {
      const node = $("toast");
      node.textContent = message;
      node.className = "show" + (error ? " error" : "");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => (node.className = ""), 4200);
    }
    async function act(promise, success) {
      try {
        const result = await promise;
        if (success) toast(typeof success === "function" ? success(result) : success);
        return result;
      } catch (error) {
        toast(error.message, true);
        return null;
      }
    }

    function openPasswordModal(account, onSaved) {
      const existing = document.getElementById("password-modal");
      if (existing) existing.remove();

      const title = account.hasPassword ? `Reset Password: ${account.displayName}` : `Set Password: ${account.displayName}`;
      const input = el("input", {
        type: "password",
        class: "field",
        placeholder: "At least 8 characters…",
        style: "flex:1 1 auto; font-family:var(--mono);",
        autocomplete: "new-password"
      });

      const eyeBtn = el("button", {
        type: "button",
        class: "btn ghost",
        style: "min-height:38px; padding:0 12px; font-size:12px;",
        text: "Show",
        onclick: () => {
          const isPw = input.type === "password";
          input.type = isPw ? "text" : "password";
          eyeBtn.textContent = isPw ? "Hide" : "Show";
          input.focus();
        }
      });

      const errorMsg = el("div", {
        style: "color:var(--bad); font-size:12px; font-weight:600; margin-top:8px; display:none;"
      });

      function close() {
        backdrop.classList.remove("show");
        setTimeout(() => backdrop.remove(), 160);
      }

      async function submit() {
        const pw = input.value.trim();
        if (!pw) {
          errorMsg.textContent = "Please enter a password.";
          errorMsg.style.display = "block";
          input.focus();
          return;
        }
        if (pw.length < 8) {
          errorMsg.textContent = "Password must be at least 8 characters long.";
          errorMsg.style.display = "block";
          input.focus();
          return;
        }
        errorMsg.style.display = "none";
        submitBtn.disabled = true;
        submitBtn.firstChild.textContent = "Saving…";

        const updated = await act(api(`/admin/api/accounts/${account.id}/password/reset`, { newPassword: pw }), `Password updated for ${account.displayName}`);
        if (updated) {
          close();
          if (onSaved) onSaved(updated);
        } else {
          submitBtn.disabled = false;
          submitBtn.firstChild.textContent = "Save Password";
        }
      }

      const cancelBtn = btn("Cancel", close, "ghost");
      const submitBtn = btn("Save Password", submit, "primary");

      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          submit();
        } else if (e.key === "Escape") {
          e.preventDefault();
          close();
        }
      });

      const dialog = el("div", { class: "modal-dialog", onclick: (e) => e.stopPropagation() },
        el("div", { class: "panel-head", style: "margin-bottom:8px" },
          el("h2", { text: title }),
          el("button", {
            type: "button",
            class: "btn ghost",
            style: "min-height:28px; padding:0 8px; font-size:14px; border:none;",
            text: "✕",
            onclick: close
          })),
        el("p", { class: "note", text: "Enter a new password for this account. Setting a password immediately invalidates any game sessions." }),
        el("div", { class: "field-wrap" },
          el("label", { text: "New Password (min 8 characters)" }),
          el("div", { style: "display:flex; gap:8px; align-items:center;" },
            input,
            eyeBtn
          ),
          errorMsg
        ),
        el("div", { class: "actions" },
          cancelBtn,
          submitBtn
        )
      );

      const backdrop = el("div", {
        id: "password-modal",
        class: "modal-backdrop",
        onclick: (e) => {
          if (e.target === backdrop) close();
        }
      }, dialog);

      document.body.append(backdrop);
      requestAnimationFrame(() => {
        backdrop.classList.add("show");
        input.focus();
      });
    }

    const relative = new Intl.RelativeTimeFormat(undefined, { numeric: "auto" });
    function ago(iso) {
      if (!iso) return "never";
      const seconds = (Date.parse(iso) - Date.now()) / 1000;
      for (const [unit, size] of [["day", 86400], ["hour", 3600], ["minute", 60]]) {
        if (Math.abs(seconds) >= size) return relative.format(Math.round(seconds / size), unit);
      }
      return "just now";
    }
    function duration(seconds) {
      const d = Math.floor(seconds / 86400), h = Math.floor(seconds % 86400 / 3600), m = Math.floor(seconds % 3600 / 60);
      return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m ${seconds % 60}s`;
    }

    /* The backend's uptime keeps counting between overview requests: every element marked data-uptime shows the time since
       upSince (when the backend started, from the latest overview's uptimeSeconds) and is rewritten once a second while the
       tab is visible and the backend answers. A new overview only moves upSince when it disagrees by more than rounding,
       e.g. after a restart. */
    let upSince = null;
    const uptimeSeconds = () => Math.max(0, Math.floor((Date.now() - upSince) / 1000));
    function uptime(seconds) {
      const since = Date.now() - seconds * 1000;
      if (upSince === null || Math.abs(since - upSince) > 1500) upSince = since;
      return el("span", { "data-uptime": true, text: duration(uptimeSeconds()) });
    }
    function tickUptime() {
      if (upSince === null || document.hidden || $("pulse").classList.contains("down")) return;
      const text = duration(uptimeSeconds());

        const otherAtts = (report.attachments || []).filter((a) => a !== imageAtt);

          const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          svg.setAttribute("viewBox", "0 0 24 24");

          svg.setAttribute("height", "16");
          svg.setAttribute("fill", "none");
          svg.setAttribute("stroke", "currentColor");

          path.setAttribute("d", "M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4 M7 10l5 5 5-5 M12 15V3");
          svg.appendChild(path);

          el("div", { class: "view-head" },

                el("div", {}, el("strong", { text: "Reporter: " }),

                report.reportedPlayer || report.reportedAccountId ? el("div", {},
                  el("strong", { text: "Reported Player: " }),
                  report.reportedAccountId

        if (updated) showSettings();

      const hostingList = settings.allowedHostingIps ?? ["127.0.0.1", "::1"];

            el("div", { class: "actions" },
              el("h2", { text: "Battle Royale V-Bucks Rewards" }),
              settings.battleRoyaleVbucks ? chip("On", "good") : chip("Off")),
            toggleSwitch(settings.battleRoyaleVbucks === true, (checked) =>
              save({ battleRoyaleVbucks: checked }, checked ? "Battle Royale V-Bucks rewards turned on" : "Battle Royale V-Bucks rewards turned off"))),
          el("p", { class: "note", text: "Pays V-Bucks for every kill and for a win in any Battle Royale playlist, when the match's gameserver reports the player's result. Each match pays a player once." }),
          (() => {
            const perKill = el("input", { class: "field num", type: "number", min: 0, max: 100000, value: settings.vbucksPerKill ?? 50, "aria-label": "V-Bucks per kill" });
            const perWin = el("input", { class: "field num", type: "number", min: 0, max: 100000, value: settings.vbucksPerWin ?? 500, "aria-label": "V-Bucks per win" });
            return el("div", { class: "actions", style: "margin-top:12px; align-items:center; gap:8px; flex-wrap:wrap;" },
              el("span", { class: "muted", text: "Per kill" }), perKill,
              el("span", { class: "muted", text: "Per win" }), perWin,
              btn("Save amounts", () => {
                const [kill, win] = [Number(perKill.value), Number(perWin.value)];
                if (![kill, win].every((value) => Number.isInteger(value) && value >= 0 && value <= 100000)) return toast("Amounts must be whole numbers from 0 to 100000", true);
                save({ vbucksPerKill: kill, vbucksPerWin: win }, `V-Bucks rewards: ${kill} a kill, ${win} a win`);
              }, "primary"));
          })()),

        el("section", { class: "panel", style: "margin-top:16px" },
          (() => {
            const own = settings.structureLimits ?? {};
            const custom = settings.structureLimit || Object.keys(own).length;
            return el("div", { class: "panel-head", style: "margin-bottom:8px" },
              el("div", { class: "actions" },
                el("h2", { text: "Storm Shield Structure Limit" }),
                custom ? chip("Custom", "good") : chip("Game's 3000")));
          })(),
          el("p", { class: "note", text: "How many builds and traps a Storm Shield holds before building is refused. Leave a box blank for the game's limit (3000); a Storm Shield's own limit wins over the one for all of them. A Storm Shield that is running picks up a change within 30 seconds, on a Core V2 gameserver." }),
          (() => {
            const limitInput = (value, label, placeholder) => el("input", { class: "field num", type: "number", min: 1, max: 100000, value: value ?? "", placeholder, "aria-label": label });
            const all = limitInput(settings.structureLimit, "Structure limit for all Storm Shields", "3000");
            const shields = [["stonewood", "Stonewood"], ["plankerton", "Plankerton"], ["cannyValley", "Canny Valley"], ["twinePeaks", "Twine Peaks"]]
              .map(([key, name]) => ({ key, name, input: limitInput(settings.structureLimits?.[key], `Structure limit for ${name}`, String(settings.structureLimit ?? 3000)) }));
            const value = (input) => (input.value.trim() === "" ? null : Number(input.value));
            return el("div", {},
              el("div", { class: "actions", style: "margin-top:12px; align-items:center; gap:8px; flex-wrap:wrap;" },
                el("span", { class: "muted", text: "All Storm Shields" }), all),
              el("div", { class: "actions", style: "margin-top:8px; align-items:center; gap:8px; flex-wrap:wrap;" },
                ...shields.flatMap(({ name, input }) => [el("span", { class: "muted", text: name }), input])),
              el("div", { class: "actions", style: "margin-top:12px; gap:8px;" },
                btn("Save limits", () => {
                  const limits = [all, ...shields.map(({ input }) => input)].map(value);
                  if (!limits.every((limit) => limit === null || (Number.isInteger(limit) && limit >= 1 && limit <= 100000))) {
                    return toast("Limits must be whole numbers from 1 to 100000, or blank", true);
                  }
                  const structureLimits = Object.fromEntries(shields.map(({ key }, index) => [key, limits[index + 1]]));
                  save({ structureLimit: limits[0], structureLimits }, limits[0] ? `Storm Shield structure limit: ${limits[0]}` : "Storm Shield structure limits saved");
                }, "primary"),
                btn("Use the game's", () => save({ structureLimit: null, structureLimits: Object.fromEntries(shields.map(({ key }) => [key, null])) },
                  "Storm Shields use the game's structure limit"), "ghost")));
          })()),

        el("section", { class: "panel", style: "margin-top:16px" },
          el("div", { class: "panel-head" },
            el("h2", { text: "Trusted Hosting IPs" }),
            chip("Dedicated Server Whitelist", "sky")),
          el("p", { class: "note", text: "IP addresses permitted to authenticate passwordless server accounts (CoreServer{n} or Server{n}) for hosting matches. Loopback (127.0.0.1) is always allowed." }),
          el("div", { class: "actions", style: "margin-top:12px; gap:8px; flex-wrap:wrap;" },
            ...hostingList.map((ip) => {
              const isRemovable = ip !== "127.0.0.1" && ip !== "::1";
              return el("span", {
                class: `chip sky${isRemovable ? " removable" : ""}`,
                title: isRemovable ? `Click to remove ${ip}` : "Default loopback IP",
                style: "display:inline-flex; align-items:center; padding:4px 10px;",
                onclick: isRemovable ? async () => {
                  await act(api(`/admin/api/settings/hosting-ips/${encodeURIComponent(ip)}`, {}, "DELETE"), `Removed ${ip}`);
                  showSettings();
                } : null
              },
                el("span", { text: ip, class: "mono" }),
                isRemovable ? el("span", { class: "remove-x", text: "✕" }) : null
              );
            })
          ),
          el("div", { class: "actions", style: "margin-top:12px; align-items:center; width:100%" },
            newIpInput,
            addIpBtn
          )
        ),

        el("section", { class: "panel", style: "margin-top:16px" },
          el("div", { class: "panel-head" },
            el("h2", { text: "Player Web Portal" }),
            settings.publicAddress ? chip(`Public: ${settings.publicAddress}`, "sky") : null),
          el("p", { class: "note", text: "Share this URL with players so they can register their account or change their password in their browser." }),
          el("div", { class: "actions", style: "margin-top:12px; align-items:center;" },
            el("input", { class: "field", value: portalLink, readonly: true, style: "flex:1 1 320px; font-family:var(--mono);" }),
            btn("Copy link", () => {
              navigator.clipboard.writeText(portalLink);
              toast("Portal URL copied to clipboard");
            }, "ghost"),
            btn("Open portal", () => window.open(portalLink, "_blank"), "primary")))
      );
    }

    /* ---------- header status ---------- */
    async function heartbeat() {
      try {
        const o = await api("/admin/api/overview");
        $("pulse").className = "pulse";
        $("server-line").replaceChildren(`${location.host} · ${o.online.length} online · ${o.sessions.length} sessions · up `, uptime(o.uptimeSeconds));
      } catch {
        $("pulse").className = "pulse down";
        $("server-line").textContent = `${location.host} · not answering`;
      }
    }
    setInterval(heartbeat, 10000);
    heartbeat();
    route();
  </script>
</body>

</html>
