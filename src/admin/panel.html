<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Core Admin</title>
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230078f2'/%3E%3Cpath d='M21 11.5a6 6 0 1 0 0 9' fill='none' stroke='%23fff' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    /* Today's Epic launcher and store: dark neutral surfaces, white Inter text, bold condensed headings, rounded cards
     with hairline borders, Epic blue for the main action. Works offline too (system fonts stand in). */
    :root {
      color-scheme: dark;
      --bg: #121212;
      --sidebar: #121212;
      --surface: #202020;
      --surface-2: #2a2a2a;
      --surface-3: #343434;
      --field: #161616;
      --line: rgba(255, 255, 255, .08);
      --line-strong: rgba(255, 255, 255, .16);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, .62);
      --faint: rgba(255, 255, 255, .42);
      --blue: #0078f2;
      --blue-hover: #268ef5;
      --blue-soft: rgba(0, 120, 242, .16);
      --good: #3ccf6e;
      --warn: #f5b13d;
      --bad: #ef4444;
      --amber: #ffca3a;
      --r-c: #9aa3ad;
      --r-uc: #5fc23b;
      --r-r: #3a96ff;
      --r-vr: #b45cf2;
      --r-sr: #f5a03a;
      --radius: 12px;
      --radius-sm: 8px;
      --sans: "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      --display: "Barlow Condensed", "Bahnschrift SemiBold Condensed", "Bahnschrift", "Roboto Condensed", "Arial Narrow", sans-serif;
      --mono: "Cascadia Mono", Consolas, ui-monospace, monospace;
      font-family: var(--sans);
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
      overflow-x: clip;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    select {
      font: inherit;
      color: inherit;
    }

    a {
      color: #fff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    code,
    .mono {
      font-family: var(--mono);
      font-size: 12px;
    }

    .muted {
      color: var(--muted);
    }

    h1,
    h2,
    .display {
      font-family: var(--display);
      font-weight: 800;
      font-stretch: 75%;
      letter-spacing: .01em;
      margin: 0;
      line-height: 1.05;
    }

    h1 {
      font-size: 40px;
    }

    h2 {
      font-size: 22px;
    }

    h3 {
      margin: 0;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* App shell: a left sidebar, the page beside it */
    .shell {
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 20px 14px;
      background: var(--sidebar);
      border-right: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 10px 18px;
      color: #fff;
    }

    .brand:hover {
      text-decoration: none;
    }

    .brand .mark {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      background: var(--blue);
      flex: none;
    }

    .brand .word {
      font-family: var(--display);
      font-weight: 800;
      font-stretch: 75%;
      font-size: 26px;
      line-height: 1;
      letter-spacing: .02em;
    }

    .brand .word span {
      color: var(--muted);
      font-weight: 600;
      margin-left: 5px;
    }

    nav.nav {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    nav.nav a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      color: var(--muted);
      font-weight: 600;
      font-size: 14px;
    }

    nav.nav a:hover {
      color: #fff;
      background: rgba(255, 255, 255, .05);
      text-decoration: none;
    }

    nav.nav a[aria-current="page"] {
      color: #fff;
      background: rgba(255, 255, 255, .1);
    }

    nav.nav svg {
      width: 20px;
      height: 20px;
      flex: none;
    }

    .server {
      margin-top: auto;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      min-width: 0;
    }

    .server #server-line {
      overflow-wrap: anywhere;
    }

    .pulse {
      width: 8px;
      height: 8px;
      margin-top: 4px;
      border-radius: 50%;
      background: var(--good);
      flex: none;
      box-shadow: 0 0 0 0 rgba(60, 207, 110, .6);
      animation: pulse 2s infinite;
    }

    .pulse.down {
      background: var(--bad);
      animation: none;
    }

    @keyframes pulse {
      70% {
        box-shadow: 0 0 0 8px rgba(60, 207, 110, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(60, 207, 110, 0);
      }
    }

    main {
      width: 100%;
      max-width: 1440px;
      margin: 0 auto;
      padding: 32px 36px 48px;
      min-width: 0;
    }

    .view-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .view-head .muted {
      margin-top: 6px;
    }

    /* Cards */
    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px;
      min-width: 0;
    }

    .panel+.panel,
    .grid+.panel,
    .tiles+.panel {
      margin-top: 16px;
    }

    .grid>.panel+.panel {
      margin-top: 0;
    }

    .panel .panel {
      background: var(--surface-2);
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .panel-head a {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .grid.cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .grid.cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 38px;
      padding: 0 16px;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      cursor: pointer;
      white-space: nowrap;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: .01em;
      background: var(--surface-3);
      color: #fff;
      transition: background-color .12s, border-color .12s, opacity .12s;
    }

    .btn:hover {
      background: #404040;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn.primary {
      background: var(--blue);
    }

    .btn.primary:hover {
      background: var(--blue-hover);
    }

    .btn.ghost {
      background: transparent;
      border-color: var(--line-strong);
    }

    .btn.ghost:hover {
      background: rgba(255, 255, 255, .07);
      border-color: rgba(255, 255, 255, .3);
    }

    .btn.danger {
      background: rgba(239, 68, 68, .14);
      border-color: rgba(239, 68, 68, .45);
      color: #ff8a8a;
    }

    .btn.danger:hover {
      background: var(--bad);
      border-color: var(--bad);
      color: #fff;
    }

    .btn.small {
      min-height: 30px;
      padding: 0 11px;
      font-size: 13px;
      border-radius: 7px;
    }

    .btn:disabled {
      opacity: .45;
      cursor: default;
    }

    .btn:disabled:hover {
      background: var(--surface-3);
    }

    .btn.primary:disabled:hover {
      background: var(--blue);
    }

    .btn:focus-visible,
    a:focus-visible,
    input:focus-visible,
    select:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    /* Inputs */
    .field {
      min-height: 38px;
      padding: 7px 12px;
      background: var(--field);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      color: var(--text);
      min-width: 0;
      transition: border-color .12s, box-shadow .12s;
    }

    .field::placeholder {
      color: var(--faint);
    }

    .field:hover {
      border-color: rgba(255, 255, 255, .26);
    }

    .field:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px var(--blue-soft);
      outline: none;
    }

    .field:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .field.num {
      width: 120px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .field.tiny {
      width: 80px;
      min-height: 30px;
      padding: 3px 8px;
      text-align: right;
      border-radius: 7px;
    }

    select.field {
      padding-right: 28px;
    }

    label.check {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: var(--muted);
    }

    label.check input {
      accent-color: var(--blue);
      width: 16px;
      height: 16px;
    }

    /* Switch toggle */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
      flex: none;
      cursor: pointer;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: rgba(255, 255, 255, .14);
      border: 1px solid var(--line-strong);
      transition: background-color .15s, border-color .15s;
      border-radius: 999px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background: #fff;
      transition: transform .15s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 50%;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .4);
    }

    .switch input:checked+.slider {
      background: var(--blue);
      border-color: var(--blue);
    }

    .switch input:focus-visible+.slider {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    .switch input:checked+.slider:before {
      transform: translateX(20px);
    }

    .switch input:disabled+.slider {
      opacity: .4;
      cursor: not-allowed;
    }

    .switch.disabled,
    .switch.disabled .slider {
      cursor: not-allowed;
      opacity: .4;
    }

    /* Stat tiles */
    .tiles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    .tile {
      padding: 16px 18px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      min-width: 0;
    }

    .panel .tile {
      background: var(--surface-2);
    }

    .tile .label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }

    .tile .value {
      font-size: 30px;
      font-weight: 700;
      line-height: 1.15;
      margin-top: 6px;
      letter-spacing: -.01em;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }

    .tile .value small {
      font-size: 15px;
      color: var(--muted);
      font-weight: 500;
      margin-left: 4px;
    }

    .tile.accent {
      background: linear-gradient(135deg, rgba(0, 120, 242, .3), rgba(0, 120, 242, .06) 70%), var(--surface);
      border-color: rgba(0, 120, 242, .45);
    }

    .tile.vbucks .value {
      color: #9fd0ff;
    }

    .tile.text .value {
      font-size: 20px;
      line-height: 1.3;
    }

    .tile .value .sub {
      display: block;
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
      margin-top: 2px;
    }

    /* Pills */
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: rgba(255, 255, 255, .08);
      color: var(--muted);
      white-space: nowrap;
    }

    button.chip {
      border: none;
      outline: none;
      box-shadow: none;
      cursor: pointer;
      font-family: inherit;
    }

    .chip.good {
      color: #6ee59a;
      background: rgba(60, 207, 110, .14);
    }

    .chip.warn {
      color: var(--warn);
      background: rgba(245, 177, 61, .14);
    }

    .chip.bad {
      color: #ff9b9b;
      background: rgba(239, 68, 68, .18);
    }

    .chip.sky {
      color: #79b8ff;
      background: var(--blue-soft);
    }

    .chip.yellow {
      color: var(--amber);
      background: rgba(255, 202, 58, .14);
    }

    .chip.c,
    .chip.common {
      color: var(--r-c);
      background: color-mix(in srgb, var(--r-c) 16%, transparent);
      border: 1px solid color-mix(in srgb, var(--r-c) 25%, transparent);
    }

    .chip.uc,
    .chip.uncommon {
      color: var(--r-uc);
      background: color-mix(in srgb, var(--r-uc) 16%, transparent);
      border: 1px solid color-mix(in srgb, var(--r-uc) 25%, transparent);
    }

    .chip.r,
    .chip.rare {
      color: var(--r-r);
      background: color-mix(in srgb, var(--r-r) 16%, transparent);
      border: 1px solid color-mix(in srgb, var(--r-r) 25%, transparent);
    }

    .chip.vr,
    .chip.epic,
    .chip.veryrare {
      color: var(--r-vr);
      background: color-mix(in srgb, var(--r-vr) 16%, transparent);
      border: 1px solid color-mix(in srgb, var(--r-vr) 25%, transparent);
    }

    .chip.sr,
    .chip.legendary,
    .chip.superrare {
      color: var(--r-sr);
      background: color-mix(in srgb, var(--r-sr) 16%, transparent);
      border: 1px solid color-mix(in srgb, var(--r-sr) 25%, transparent);
    }

    .chip.removable {
      cursor: pointer;
      transition: background-color .15s, color .15s;
      user-select: none;
      text-decoration: none;
    }

    .chip.removable .remove-x {
      display: none;
      margin-left: 4px;
      font-weight: 700;
      font-size: 11px;
      line-height: 1;
    }

    .chip.removable:hover {
      color: #ff9b9b;
      background: rgba(239, 68, 68, .22);
    }

    .chip.removable:hover .remove-x {
      display: inline-block;
    }

    /* Tables */
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 11px 14px;
      text-align: left;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
      vertical-align: middle;
    }

    th {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      background: rgba(255, 255, 255, .03);
      position: sticky;
      top: 0;
    }

    tbody tr {
      transition: background-color .1s;
    }

    tbody tr:hover {
      background: rgba(255, 255, 255, .035);
    }

    tr:last-child td {
      border-bottom: 0;
    }

    td.num,
    th.num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    td.wrap {
      white-space: normal;
    }

    td .actions {
      flex-wrap: nowrap;
    }

    td a {
      font-weight: 600;
    }

    .empty {
      padding: 40px 16px;
      text-align: center;
      color: var(--muted);
    }

    .empty h2 {
      color: #fff;
      margin-bottom: 8px;
    }

    /* Rarity */
    .rarity {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 10px;
      background: var(--r-c);
      flex: none;
    }

    .rarity.c,
    .rarity.common {
      background: var(--r-c);
    }

    .rarity.uc,
    .rarity.uncommon {
      background: var(--r-uc);
    }

    .rarity.r,
    .rarity.rare {
      background: var(--r-r);
    }

    .rarity.vr,
    .rarity.epic,
    .rarity.veryrare {
      background: var(--r-vr);
    }

    .rarity.sr,
    .rarity.legendary,
    .rarity.superrare {
      background: var(--r-sr);
    }

    .item-name {
      display: inline-flex;
      align-items: center;
      font-weight: 600;
    }

    .item-name .tid {
      margin-left: 10px;
      color: var(--faint);
      font-weight: 400;
    }

    /* Players view */
    .players {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }

    .roster {
      position: sticky;
      top: 24px;
      max-height: calc(100vh - 48px);
      display: flex;
      flex-direction: column;
      padding: 16px;
    }

    .roster .field {
      width: 100%;
    }

    .roster .list {
      list-style: none;
      margin: 10px -8px 0;
      padding: 0;
      overflow-y: auto;
    }

    .roster .list button {
      width: 100%;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 0 12px;
      align-items: center;
      padding: 9px 10px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
      text-align: left;
    }

    .roster .list button:hover {
      background: rgba(255, 255, 255, .05);
    }

    .roster .list button[aria-current="true"] {
      background: rgba(255, 255, 255, .1);
    }

    .avatar {
      grid-row: span 2;
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      font-weight: 700;
      font-size: 15px;
      background: linear-gradient(140deg, #0078f2, #6a3bd8);
      color: #fff;
    }

    .roster .name {
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .roster .sub {
      grid-column: 2 / -1;
      color: var(--faint);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4a4a4a;
    }

    .dot.on {
      background: var(--good);
      box-shadow: 0 0 0 3px rgba(60, 207, 110, .18);
    }

    .hero-head {
      display: flex;
      gap: 18px;
      align-items: center;
      flex-wrap: wrap;
    }

    .hero-head .avatar {
      width: 64px;
      height: 64px;
      font-size: 26px;
      grid-row: auto;
    }

    .hero-head .who {
      flex: 1;
      min-width: 220px;
    }

    .hero-head .who code {
      display: block;
      margin-top: 4px;
    }

    .hero-head .chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .subtabs {
      display: flex;
      gap: 22px;
      margin: 20px 0 20px;
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
    }

    .subtabs button {
      border: 0;
      background: transparent;
      cursor: pointer;
      padding: 10px 0;
      color: var(--muted);
      font-weight: 600;
      font-size: 14px;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }

    .subtabs button:hover {
      color: #fff;
    }

    .subtabs button[aria-selected="true"] {
      color: #fff;
      border-bottom-color: #fff;
    }

    .subtabs button .count {
      display: inline-block;
      min-width: 22px;
      margin-left: 6px;
      padding: 0 6px;
      border-radius: 999px;
      font-size: 11px;
      line-height: 18px;
      text-align: center;
      background: rgba(255, 255, 255, .1);
      color: var(--muted);
    }

    .bar {
      height: 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .08);
      overflow: hidden;
    }

    .bar>div {
      height: 100%;
      border-radius: 999px;
      background: var(--blue);
    }

    .bar.rest>div {
      background: linear-gradient(90deg, #6a3bd8, #a77bff);
    }

    .balance {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px 12px;
      align-items: center;
      padding: 16px;
      border-radius: var(--radius);
      background: var(--surface-2);
      border: 1px solid var(--line);
    }

    .balance .label {
      font-weight: 600;
      color: var(--muted);
    }

    .balance .row {
      grid-column: 1 / -1;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    .balance .amount {
      font-size: 24px;
      font-weight: 700;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .filters {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .filters button {
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      background: transparent;
      padding: 5px 14px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      color: var(--muted);
    }

    .filters button:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, .3);
    }

    .filters button[aria-pressed="true"] {
      background: #fff;
      color: #121212;
      border-color: #fff;
    }

    .catalog {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .card {
      --rarity: var(--r-c);
      position: relative;
      text-align: left;
      cursor: pointer;
      padding: 14px 14px 12px 18px;
      min-height: 92px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: linear-gradient(135deg, color-mix(in srgb, var(--rarity) 22%, transparent), transparent 65%), var(--surface-2);
      overflow: hidden;
      transition: border-color .12s, transform .12s;
    }

    .card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--rarity);
    }

    .card:hover {
      border-color: rgba(255, 255, 255, .28);
      transform: translateY(-1px);
    }

    .card.c,
    .card.common {
      --rarity: var(--r-c);
    }

    .card.uc,
    .card.uncommon {
      --rarity: var(--r-uc);
    }

    .card.r,
    .card.rare {
      --rarity: var(--r-r);
    }

    .card.vr,
    .card.epic,
    .card.veryrare {
      --rarity: var(--r-vr);
    }

    .card.sr,
    .card.legendary,
    .card.superrare {
      --rarity: var(--r-sr);
    }

    .card[aria-pressed="true"] {
      border-color: var(--blue);
      box-shadow: 0 0 0 2px var(--blue);
    }

    .card .t {
      font-weight: 700;
      line-height: 1.25;
      padding-right: 74px;
    }

    .card .s {
      font-size: 11px;
      color: var(--faint);
      margin-top: 6px;
      overflow-wrap: anywhere;
    }

    .card .k {
      position: absolute;
      right: 10px;
      top: 10px;
      padding: 1px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--muted);
      background: rgba(0, 0, 0, .35);
    }

    .quick {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 8px;
    }

    .quick .btn {
      justify-content: flex-start;
    }

    .shields {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 12px;
    }

    .shield {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-2);
    }

    .shield .lvl {
      font-family: var(--display);
      font-weight: 800;
      font-stretch: 75%;
      font-size: 52px;
      line-height: 1;
      margin-top: 8px;
    }

    .shield .lvl small {
      font-size: 22px;
      color: var(--muted);
      font-weight: 600;
    }

    .pips {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 4px;
      margin: 12px 0;
    }

    .pips span {
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .1);
    }

    .pips span.on {
      background: var(--blue);
    }

    .danger-zone {
      border-color: rgba(239, 68, 68, .35);
    }

    .panel .danger-zone {
      background: linear-gradient(135deg, rgba(239, 68, 68, .1), transparent 60%), var(--surface-2);
    }

    .danger-zone h2 {
      color: #ff9b9b;
    }

    .panel>h2+.note,
    .panel>h2+p {
      margin-top: 6px;
    }

    .option-row {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      margin: 12px 0 16px;
    }

    .log {
      height: calc(100vh - 380px);
      min-height: 280px;
      overflow-y: auto;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.6;
      background: #0b0b0b;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 0;
    }

    .log div {
      padding: 0 14px;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .log div:hover {
      background: rgba(255, 255, 255, .03);
    }

    .log .t {
      color: #6b6b6b;
    }

    .log .c {
      color: #9fd0ff;
    }

    .log .HTTP {
      color: #cfcfcf;
    }

    .log .XMPP {
      color: #c4a5ff;
    }

    .log .Matchmaking {
      color: #7ee2a2;
    }

    .log .World,
    .log .MCP {
      color: #ffd479;
    }

    #toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: min(440px, calc(100% - 32px));
      padding: 12px 16px;
      border-radius: 10px;
      background: var(--surface-3);
      border: 1px solid var(--line-strong);
      box-shadow: 0 16px 40px rgba(0, 0, 0, .55);
      font-weight: 500;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .15s, transform .15s;
      pointer-events: none;
    }

    #toast::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--good);
      flex: none;
    }

    #toast.show {
      opacity: 1;
      transform: none;
    }

    #toast.error::before {
      background: var(--bad);
    }

    .note {
      color: var(--muted);
      font-size: 13px;
    }

    /* In-window Modal Dialog */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .72);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
      opacity: 0;
      transition: opacity .15s ease-out;
    }

    .modal-backdrop.show {
      opacity: 1;
    }

    .modal-dialog {
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      padding: 24px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 48px rgba(0, 0, 0, .6);
      transform: scale(.95);
      transition: transform .15s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-backdrop.show .modal-dialog {
      transform: scale(1);
    }

    .modal-dialog h2 {
      font-size: 18px;
      font-weight: 700;
      margin: 0;
    }

    .modal-dialog p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      margin: 10px 0 16px;
    }

    .modal-dialog .field-wrap {
      margin-bottom: 20px;
    }

    .modal-dialog .field-wrap label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .modal-dialog .actions {
      justify-content: flex-end;
      gap: 8px;
    }

    @media (max-width: 1100px) {
      .players {
        grid-template-columns: minmax(0, 1fr);
      }

      .roster {
        position: static;
        max-height: 380px;
      }

    @media (max-width: 980px) {

      .grid.cols-3 {
        grid-template-columns: minmax(0, 1fr);

    }

        top: 0;
        z-index: 10;

        gap: 8px;

        border-right: 0;
        border-bottom: 1px solid var(--line);

      nav.nav {
        flex-direction: row;
        overflow-x: auto;
        scrollbar-width: none;
        min-width: 0;
      }

      nav.nav a {
        padding: 8px 10px;
        flex: none;
      }

      .server {
        margin: 0 0 0 auto;
        padding: 0;
        background: none;
        border: 0;
      }

      .server #server-line {
        display: none;
      }

      main {
        padding: 20px 16px 40px;
      }

      h1 {
        font-size: 32px;
      }
    }

    @media (max-width: 560px) {
      nav.nav a span {
        display: none;
      }

        flex-wrap: nowrap;
        overflow-x: auto;
        scrollbar-width: none;
        gap: 18px;
      }

      .subtabs button {
        flex: none;
      }

      .tiles {
        grid-template-columns: repeat(2, minmax(0, 1fr));

        font-size: 24px;
      }

      .panel {
        padding: 16px;
      }
    }

    .login-screen {
      position: fixed;

    .login-header {

    .login-brand .mark {

      align-items: center;
      justify-content: center;

    .login-brand .word span {
      color: var(--muted);
      font-weight: 600;
      margin-left: 5px;
    }

    .login-desc {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      margin: 0 0 20px 0;
    }

    .login-error {

    .login-form-group {
      margin-bottom: 14px;
    }

    .login-form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .pw-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .pw-toggle-btn {
      position: absolute;
      right: 8px;
      background: transparent;
      border: none;

      font-size: 12px;

    .pw-toggle-btn:hover {

      background: var(--surface-2);
    }

    .login-submit {
      width: 100%;

      height: 42px;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .admin-user-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;

      box-sizing: border-box;
    }

    .admin-user-badge {
      display: flex;

      gap: 6px;
      font-size: 12px;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }



  </style>
</head>

        if (key === "class") node.className = value;
        else if (key === "text") node.textContent = value;
        else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
        else if (key in node && typeof value !== "string") node[key] = value;
        else node.setAttribute(key, value === true ? "" : value);

      for (const child of children.flat(Infinity)) if (child !== null && child !== undefined && child !== false) node.append(child instanceof Node ? child : String(child));

    /* ---------- logs ---------- */
    async function pullLogs() {
      if (state.logPaused) return;
      const lines = await api(`/admin/api/logs?after=${state.logAfter}`).catch(() => null);
      if (!lines?.length) return;
      state.logAfter = lines[lines.length - 1].seq;
      state.logs.push(...lines);
      if (state.logs.length > 2000) state.logs.splice(0, state.logs.length - 2000);
      renderLogLines();
    }
    function renderLogLines() {
      const box = $("log");
      if (!box) return;
      const query = state.logFilter.toLowerCase();
      const stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
      const shown = state.logs.filter((line) => (!state.logCategory || line.category === state.logCategory) && (!query || line.message.toLowerCase().includes(query)));
      box.replaceChildren(...shown.slice(-800).map((line) => el("div", { class: line.category },
        el("span", { class: "t", text: new Date(line.at).toLocaleTimeString() }), " ", el("span", { class: "c", text: `[${line.category}]` }), " ", line.message)));
      if (stick) box.scrollTop = box.scrollHeight;
    }
    async function showLogs() {
      const categories = ["", "HTTP", "Core", "XMPP", "STOMP", "Matchmaking", "MCP", "World", "Items", "Replay"];
      const filter = el("input", { class: "field", type: "search", placeholder: "Filter messages", value: state.logFilter, style: "flex:1 1 260px" });
      filter.addEventListener("input", () => { state.logFilter = filter.value; renderLogLines(); });
      const category = el("select", { class: "field", "aria-label": "Category" }, categories.map((c) => el("option", { value: c, text: c || "Every category", selected: state.logCategory === c })));

                list.append(tier.row);
              };
              for (const { top, vbucks } of mode.placements ?? []) addTier(top, vbucks);
              const panel = el("section", { class: "panel" },
                el("h3", { text: name }),
                el("div", { class: "actions", style: "margin-top:12px; align-items:center; gap:8px; flex-wrap:wrap;" },
                  el("span", { class: "muted", text: "Per kill" }), perKill),
                el("div", { class: "actions", style: "margin-top:8px; align-items:center; gap:8px; flex-wrap:wrap;" },
                  el("span", { class: "muted", text: "Per win" }), perWin),
                el("div", { class: "muted", style: "margin-top:12px", text: "Placement (best one only)" }),
                list,
                el("div", { class: "actions", style: "margin-top:8px;" }, btn("Add placement", () => addTier(), "ghost")));
              return { key, name, perKill, perWin, tiers, panel };
            });
            const whole = (value, min, max) => Number.isInteger(value) && value >= min && value <= max;
            return el("div", {},
              el("div", { class: "grid cols-3", style: "margin-top:12px" }, columns.map(({ panel }) => panel)),
              el("div", { class: "actions", style: "margin-top:12px; gap:8px;" },
                btn("Save rewards", () => {
                  const battleRoyaleRewards = {};
                  for (const { key, name, perKill, perWin, tiers } of columns) {
                    const [kill, win] = [Number(perKill.value), Number(perWin.value)];
                    if (![kill, win].every((value) => whole(value, 0, 100000))) return toast(`${name}: amounts must be whole numbers from 0 to 100000`, true);
                    const placements = tiers.filter((tier) => tier.top.value.trim() || tier.vbucks.value.trim())
                      .map((tier) => ({ top: Number(tier.top.value), vbucks: Number(tier.vbucks.value) }));
                    if (!placements.every(({ top, vbucks }) => whole(top, 1, 100) && whole(vbucks, 0, 100000))) {
                      return toast(`${name}: a placement needs a top from 1 to 100 and V-Bucks from 0 to 100000`, true);
                    }
                    battleRoyaleRewards[key] = { perKill: kill, perWin: win, placements };
                  }
                  save({ battleRoyaleRewards }, "Battle Royale V-Bucks rewards saved");
                }, "primary")));
          })()),

        el("section", { class: "panel", style: "margin-top:16px" },
          el("div", { class: "panel-head", style: "margin-bottom:8px" },
            el("div", { class: "actions" },
              el("h2", { text: "Battle Royale Matchmaking" }),
              chip(`${settings.matchmakingGatherSeconds ?? 10} s to gather`, "sky"),
              chip(settings.warmupSeconds ? `${settings.warmupSeconds} s warmup` : "Game's warmup", settings.warmupSeconds ? "good" : undefined),
              settings.lateJoin ? chip("Late joining", "good") : chip("No late joining"),
              settings.regionFallback === false ? chip("Own region only", "good") : chip("Region fallback"))),
          el("p", { class: "note", text: "Gather time: how long a match forming on a free gameserver waits for more parties after the first one readies up, which is the ETA the queue counts down. Warmup: how long players stay on the warmup island before the Battle Bus leaves (blank for the game's own, in full: it only shortens for a nearly full match of full size, not one that only reserved the players it has). Late joining: while a match is still in its warmup, players who queue for the same playlist and region join it instead of waiting for a new one, until 15 seconds before the bus. Region fallback: a player whose region has no gameserver at all plays on another region's; off, they only ever match in the region they picked and wait until one of its gameservers is free. Warmup and late joining need a Core V2 gameserver; a change reaches a running one within 30 seconds, before its warmup starts." }),
          (() => {
            const gather = el("input", { class: "field num", type: "number", min: 0, max: 300, value: settings.matchmakingGatherSeconds ?? 10, "aria-label": "Gather time in seconds" });
            const warmup = el("input", { class: "field num", type: "number", min: 10, max: 1800, value: settings.warmupSeconds ?? "", placeholder: "Game's", "aria-label": "Warmup in seconds" });
            return el("div", {},
              el("div", { class: "actions", style: "margin-top:12px; align-items:center; gap:8px; flex-wrap:wrap;" },
                el("span", { class: "muted", text: "Gather time (s)" }), gather,
                el("span", { class: "muted", text: "Warmup (s)" }), warmup,
                btn("Save times", () => {
                  const gatherSeconds = Number(gather.value);
                  const warmupSeconds = warmup.value.trim() === "" ? null : Number(warmup.value);
                  if (!Number.isInteger(gatherSeconds) || gatherSeconds < 0 || gatherSeconds > 300) return toast("The gather time must be a whole number of seconds from 0 to 300", true);
                  if (warmupSeconds !== null && (!Number.isInteger(warmupSeconds) || warmupSeconds < 10 || warmupSeconds > 1800)) {
                    return toast("The warmup must be a whole number of seconds from 10 to 1800, or blank", true);
                  }
                  save({ matchmakingGatherSeconds: gatherSeconds, warmupSeconds },
                    `Matchmaking: ${gatherSeconds} s to gather, ${warmupSeconds === null ? "the game's warmup" : `${warmupSeconds} s warmup`}`);
                }, "primary")),
              el("div", { class: "actions", style: "margin-top:12px; align-items:center; gap:8px;" },
                el("span", { class: "muted", text: "Late joining during the warmup" }),
                toggleSwitch(settings.lateJoin === true, (checked) =>
                  save({ lateJoin: checked }, checked ? "Players can join a match during its warmup" : "Late joining turned off"))),
              el("div", { class: "actions", style: "margin-top:12px; align-items:center; gap:8px;" },
                el("span", { class: "muted", text: "Play in another region when theirs has no gameserver" }),
                toggleSwitch(settings.regionFallback !== false, (checked) =>
                  save({ regionFallback: checked }, checked ? "Players whose region has no gameserver play in another region" : "Players only match in the region they pick"))));
          })()),

        el("section", { class: "panel", style: "margin-top:16px" },
          el("div", { class: "panel-head" },
            el("h2", { text: "Trusted Hosting IPs" }),
            (() => {
              const others = hostingList.filter((ip) => ip !== "127.0.0.1" && ip !== "::1").length;
              return others ? chip(`${others} other PC${others === 1 ? "" : "s"}`, "good") : chip("This PC only");
            })()),
          el("p", { class: "note", text: "Gameservers on other PCs: list a PC's IP address here and its Core Launcher's gameservers can host for this backend, each in the region its launcher's Servers settings pick, and players are sent to that PC's IP. The IP is the one its connections reach this backend from (its public IP over the internet, or its LAN or VPN address), as the Logs show when one is refused. Only listed PCs may log in to the server accounts (CoreServer{n}, Server{n}), take the dedicated server token or register game sessions, and each can only change its own sessions. This PC is always allowed. It needs remote access on (Play with friends), and the other PC's game and beacon ports forwarded on its own router for players on the internet." }),
          el("div", { class: "actions", style: "margin-top:12px; gap:8px; flex-wrap:wrap;" },
            ...hostingList.map((ip) => {
              const isRemovable = ip !== "127.0.0.1" && ip !== "::1";
              return el("span", {
                class: `chip sky${isRemovable ? " removable" : ""}`,
                title: isRemovable ? `Click to remove ${ip}` : "Default loopback IP",
                style: "display:inline-flex; align-items:center; padding:4px 10px;",
                onclick: isRemovable ? async () => {
                  await act(api(`/admin/api/settings/hosting-ips/${encodeURIComponent(ip)}`, {}, "DELETE"), `Removed ${ip}`);
                  showSettings();
                } : null
              },
                el("span", { text: ip, class: "mono" }),
                isRemovable ? el("span", { class: "remove-x", text: "✕" }) : null
              );
            })
          ),
          el("div", { class: "actions", style: "margin-top:12px; align-items:center; width:100%" },
            newIpInput,
            addIpBtn
          )
        ),

        el("section", { class: "panel", style: "margin-top:16px" },
          (() => {
            const own = settings.structureLimits ?? {};
            const custom = settings.structureLimit || Object.keys(own).length;
            return el("div", { class: "panel-head", style: "margin-bottom:8px" },
              el("div", { class: "actions" },
                el("h2", { text: "Storm Shield Structure Limit" }),
                custom ? chip("Custom", "good") : chip("Game's 3000")));
          })(),
          el("p", { class: "note", text: "How many builds and traps a Storm Shield holds before building is refused. Leave a box blank for the game's limit (3000); a Storm Shield's own limit wins over the one for all of them. A Storm Shield that is running picks up a change within 30 seconds, on a Core V2 gameserver." }),
          (() => {
            const limitInput = (value, label, placeholder) => el("input", { class: "field num", type: "number", min: 1, max: 100000, value: value ?? "", placeholder, "aria-label": label });
            const all = limitInput(settings.structureLimit, "Structure limit for all Storm Shields", "3000");
            const shields = [["stonewood", "Stonewood"], ["plankerton", "Plankerton"], ["cannyValley", "Canny Valley"], ["twinePeaks", "Twine Peaks"]]
              .map(([key, name]) => ({ key, name, input: limitInput(settings.structureLimits?.[key], `Structure limit for ${name}`, String(settings.structureLimit ?? 3000)) }));
            const value = (input) => (input.value.trim() === "" ? null : Number(input.value));
            return el("div", {},
              el("div", { class: "actions", style: "margin-top:12px; align-items:center; gap:8px; flex-wrap:wrap;" },
                el("span", { class: "muted", text: "All Storm Shields" }), all),
              el("div", { class: "actions", style: "margin-top:8px; align-items:center; gap:8px; flex-wrap:wrap;" },
                ...shields.flatMap(({ name, input }) => [el("span", { class: "muted", text: name }), input])),
              el("div", { class: "actions", style: "margin-top:12px; gap:8px;" },
                btn("Save limits", () => {
                  const limits = [all, ...shields.map(({ input }) => input)].map(value);
                  if (!limits.every((limit) => limit === null || (Number.isInteger(limit) && limit >= 1 && limit <= 100000))) {
                    return toast("Limits must be whole numbers from 1 to 100000, or blank", true);
                  }
                  const structureLimits = Object.fromEntries(shields.map(({ key }, index) => [key, limits[index + 1]]));
                  save({ structureLimit: limits[0], structureLimits }, limits[0] ? `Storm Shield structure limit: ${limits[0]}` : "Storm Shield structure limits saved");
                }, "primary"),
                btn("Use the game's", () => save({ structureLimit: null, structureLimits: Object.fromEntries(shields.map(({ key }) => [key, null])) },
                  "Storm Shields use the game's structure limit"), "ghost")));
          })()),

        el("section", { class: "panel", style: "margin-top:16px" },
          (() => {
            const mode = settings.cheats ?? "everyone";
            const allowedList = settings.cheatAccounts ?? [];
            const players = (accountList ?? []).filter((account) => !account.isServer);
            const accountOf = (entry) => {
              const key = String(entry).toLowerCase();
              return players.find((account) => account.id.toLowerCase() === key || account.displayName.toLowerCase() === key) ?? null;
            };
            const modes = [["everyone", "Every player"], ["admins", "Only the accounts below"], ["off", "Nobody"]];
            const modeSelect = el("select", { class: "field", "aria-label": "Who may use cheats", style: "min-width:220px;",
              onchange: (e) => save({ cheats: e.target.value }, `Cheats: ${modes.find(([value]) => value === e.target.value)?.[1] ?? e.target.value}`) },
              modes.map(([value, label]) => el("option", { value, text: label, selected: value === mode })));

            const nameInput = el("input", { class: "field", list: "cheat-account-names", placeholder: "Display name or account id", "aria-label": "Account allowed to cheat", style: "flex:1 1 240px;" });
            const addBtn = btn("Allow account", () => {
              const typed = nameInput.value.trim();
              if (!typed) return toast("Enter a display name or account id", true);
              const account = accountOf(typed);
              if (allowedList.some((entry) => (account ? accountOf(entry)?.id === account.id : String(entry).toLowerCase() === typed.toLowerCase()))) {
                return toast(`${account?.displayName ?? typed} may already cheat`, true);
              }
              save({ cheatAccounts: [...allowedList, account?.id ?? typed] }, `${account?.displayName ?? typed} may cheat when cheats are for the listed accounts`);
            }, "primary");
            nameInput.addEventListener("keydown", (e) => {
              if (e.key === "Enter") {
                e.preventDefault();
                addBtn.click();
              }
            });

            return [
              el("div", { class: "panel-head", style: "margin-bottom:8px" },
                el("div", { class: "actions" },
                  el("h2", { text: "Cheats" }),
                  mode === "everyone" ? chip("Every player", "warn") : mode === "admins" ? chip(`${allowedList.length} account${allowedList.length === 1 ? "" : "s"}`, "sky") : chip("Off"))),
              el("p", { class: "note", text: "Who may use \"cheat\" commands on a Core V2 gameserver: the game's cheats and Core's own (corecheats, spawnactor, skin, disguise, and a command run on another player with /Name/). Anyone else is told cheats are off and nothing runs. A running gameserver picks up a change within 30 seconds." }),
              el("div", { class: "actions", style: "margin-top:12px; align-items:center; gap:8px; flex-wrap:wrap;" },
                el("span", { class: "muted", text: "Who may cheat" }), modeSelect),
              el("div", { class: "muted", style: "margin-top:12px;", text: mode === "admins" ? "Accounts allowed to cheat:" : "Accounts allowed when cheats are for the listed accounts:" }),
              el("div", { class: "actions", style: "margin-top:8px; gap:8px; flex-wrap:wrap;" },
                allowedList.length ? allowedList.map((entry) => {
                  const account = accountOf(entry);
                  return el("span", {
                    class: "chip sky removable",
                    title: account ? `${account.displayName} (${account.id}): click to remove` : `No account has this name or id yet: click to remove`,
                    style: "display:inline-flex; align-items:center; padding:4px 10px;",
                    onclick: () => save({ cheatAccounts: allowedList.filter((other) => other !== entry) }, `${account?.displayName ?? entry} removed from the cheat accounts`)
                  },
                    el("span", { text: account?.displayName ?? entry }),
                    el("span", { class: "remove-x", text: "✕" }));
                }) : el("span", { class: "muted", text: "None yet." })),
              el("div", { class: "actions", style: "margin-top:12px; align-items:center; width:100%" },
                nameInput, addBtn,
                el("datalist", { id: "cheat-account-names" }, players.map((account) => el("option", { value: account.displayName }))))
            ];
          })()),

        el("section", { class: "panel", style: "margin-top:16px" },
          el("div", { class: "panel-head" },
            el("h2", { text: "Player Web Portal" }),
            settings.publicAddress ? chip(`Public: ${settings.publicAddress}`, "sky") : null),
          el("p", { class: "note", text: "Share this URL with players so they can register their account or change their password in their browser." }),
          el("div", { class: "actions", style: "margin-top:12px; align-items:center;" },
            el("input", { class: "field", value: portalLink, readonly: true, style: "flex:1 1 320px; font-family:var(--mono);" }),
            btn("Copy link", () => {
              navigator.clipboard.writeText(portalLink);
              toast("Portal URL copied to clipboard");
            }, "ghost"),
            btn("Open portal", () => window.open(portalLink, "_blank"), "primary")))
      );
    }

    /* ---------- header status ---------- */
    async function heartbeat() {
      try {
        const o = await api("/admin/api/overview");
        $("pulse").className = "pulse";
        $("server-line").replaceChildren(`${location.host} · ${o.online.length} online · ${o.sessions.length} sessions · up `, uptime(o.uptimeSeconds));
      } catch {
        $("pulse").className = "pulse down";
        $("server-line").textContent = `${location.host} · not answering`;
      }
    }
    /* ---------- login form & sidebar events ---------- */
    const loginForm = $("admin-login-form");
    if (loginForm) {
      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const username = $("login-username").value.trim();
        const password = $("login-password").value;
        const errorBanner = $("login-error-banner");
        const submitBtn = $("login-submit-btn");

        if (!username || !password) return;

        errorBanner.style.display = "none";
        submitBtn.disabled = true;
        submitBtn.textContent = "Signing In…";

        try {
          const res = await fetch("/admin/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
          });
          const data = await res.json().catch(() => ({}));

          if (!res.ok) {
            errorBanner.textContent = data.errorMessage || "Invalid username or password";
            errorBanner.style.display = "block";
            if (res.status === 429) {
              startLockoutCountdown(data.retryAfter || 900);
            }
            submitBtn.disabled = false;
            submitBtn.textContent = "Sign In to Dashboard";
            return;
          }

          sessionStorage.removeItem("admin_signed_out");
          currentAdmin = data.user;
          updateAdminUserBar(data.user);
          hideLoginScreen();
          toast(`Signed in as ${data.user.username}`);
          route();
          heartbeat();
        } catch (err) {
          errorBanner.textContent = err.message || "Failed to connect to server";
          errorBanner.style.display = "block";
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "Sign In to Dashboard";
        }
      });
    }

    const togglePwBtn = $("login-toggle-pw");
    if (togglePwBtn) {
      togglePwBtn.addEventListener("click", () => {
        const pwInput = $("login-password");
        const isPw = pwInput.type === "password";
        pwInput.type = isPw ? "text" : "password";
        togglePwBtn.textContent = isPw ? "Hide" : "Show";
      });
    }

    const logoutBtn = $("admin-logout-btn");
    if (logoutBtn) {
      logoutBtn.addEventListener("click", async () => {
        const ok = await confirmModal("Are you sure you want to log out of the admin console?", {
          title: "Sign Out",
          confirmText: "Sign Out",
          confirmKind: "danger"
        });
        if (!ok) return;
        try {
          await fetch("/admin/api/auth/logout", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ userId: currentAdmin?.id, username: currentAdmin?.username })
          });
        } catch {}
        sessionStorage.setItem("admin_signed_out", "1");
        currentAdmin = null;
        updateAdminUserBar(null);
        showLoginScreen("You have been signed out.");
      });
    }

    async function initAuthAndStart() {
      try {
        if (sessionStorage.getItem("admin_signed_out") === "1") {
          showLoginScreen("You have been signed out.");
          return;
        }
        const res = await fetch("/admin/api/auth/me");
        const data = await res.json().catch(() => ({}));
        if (data.sessionExpired) {
          currentAdmin = null;
          updateAdminUserBar(null);
          showLoginScreen("Session expired. Please sign in again.");
          return;
        }
        if (data.authenticated) {
          currentAdmin = data.user;
          updateAdminUserBar(data.user);
          hideLoginScreen();
          route();
          heartbeat();
        } else if (data.requireAuth) {
          showLoginScreen();
        } else {
          hideLoginScreen();
          updateAdminUserBar(null);
          route();
          heartbeat();
        }
      } catch {
        route();
        heartbeat();
      }
    }

    setInterval(heartbeat, 10000);
    initAuthAndStart();
  </script>
</body>

</html>
