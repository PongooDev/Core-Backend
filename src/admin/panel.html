<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Core Admin</title>
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: dark;
    --bg: #101014;
    --surface: #18181c;
    --surface-raised: #202024;
    --border: #2a2a30;
    --text: #ffffff;
    --muted: #a0a0ab;
    --accent: #26bbff;
    --accent-text: #101014;
    --good: #3ccb7f;
    --warn: #ffb02e;
    --bad: #ff5c5c;
    --radius: 6px;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.45; }
  button { font: inherit; }
  code { font-family: Consolas, "Cascadia Mono", ui-monospace, monospace; font-size: 12px; color: var(--muted); }

  header {
    display: flex; align-items: center; gap: 12px; padding: 0 24px; height: 56px;
    background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .mark { width: 22px; height: 22px; border-radius: 4px; background: var(--accent); }
  .brand { font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
  .brand span { color: var(--muted); font-weight: 500; letter-spacing: .04em; text-transform: none; margin-left: 6px; }
  header .host { margin-left: auto; color: var(--muted); font-size: 12px; }

  .layout { display: grid; grid-template-columns: 320px 1fr; gap: 20px; padding: 24px; max-width: 1280px; margin: 0 auto; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); min-width: 0; }
  .card-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 12px; }
  h2, h3 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 0; font-size: 26px; font-weight: 700; overflow-wrap: anywhere; }

  .search { display: block; width: calc(100% - 32px); margin: 0 16px 12px; padding: 9px 12px; border-radius: var(--radius);
    border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit; }
  .search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  .accounts { list-style: none; margin: 0; padding: 0 8px 8px; }
  .accounts button {
    width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; text-align: left; padding: 10px 10px;
    border: 0; border-radius: var(--radius); background: transparent; color: inherit; cursor: pointer;
  }
  .accounts button:hover { background: var(--surface-raised); }
  .accounts button[aria-current="true"] { background: var(--surface-raised); box-shadow: inset 3px 0 0 var(--accent); }
  .accounts .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .accounts .sub { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }

  .ghost { border: 1px solid var(--border); background: transparent; color: var(--text); padding: 6px 12px;
    border-radius: var(--radius); cursor: pointer; }
  .ghost:hover { background: var(--surface-raised); }
  .primary { border: 0; background: var(--accent); color: var(--accent-text); padding: 10px 18px; border-radius: var(--radius);
    font-weight: 700; letter-spacing: .04em; text-transform: uppercase; font-size: 13px; cursor: pointer; }
  .primary:hover { filter: brightness(1.1); }
  .primary:disabled { background: var(--surface-raised); color: var(--muted); cursor: default; filter: none; }
  :is(button):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 999px; font-size: 11px;
    font-weight: 600; letter-spacing: .04em; text-transform: uppercase; background: var(--surface-raised); color: var(--muted); white-space: nowrap; }
  .chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .chip.good { color: var(--good); }
  .chip.warn { color: var(--warn); }
  .chip.accent { color: var(--accent); }

  .detail { padding: 24px; }
  .empty { color: var(--muted); padding: 48px 16px; text-align: center; }
  .detail-head { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; justify-content: space-between; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin: 24px 0 12px; }
  .stat { background: var(--surface-raised); border-radius: var(--radius); padding: 12px 14px; }
  .stat .label { color: var(--muted); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
  .stat .value { font-size: 18px; font-weight: 600; margin-top: 4px; overflow-wrap: anywhere; }
  .note { color: var(--muted); font-size: 13px; margin: 0 0 24px; }

  section.block { margin-top: 24px; }
  section.block h3 { margin-bottom: 10px; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; background: var(--surface-raised); }
  tr:last-child td { border-bottom: 0; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }

  #toast { position: fixed; right: 24px; bottom: 24px; max-width: calc(100% - 48px); padding: 12px 16px; border-radius: var(--radius);
    background: var(--surface-raised); border: 1px solid var(--border); border-left: 3px solid var(--accent);
    opacity: 0; transform: translateY(8px); transition: opacity .15s, transform .15s; pointer-events: none; }
  #toast.show { opacity: 1; transform: none; }
  #toast.error { border-left-color: var(--bad); }

  @media (max-width: 760px) {
    header { padding: 0 16px; }
    .layout { grid-template-columns: 1fr; padding: 16px; gap: 16px; }
    .detail { padding: 16px; }
  }
</style>
</head>
<body>
<header>
  <div class="mark" aria-hidden="true"></div>
  <div class="brand">Core<span>Admin</span></div>
  <div class="host" id="host"></div>
</header>

<main class="layout">
  <nav class="card" aria-label="Accounts">
    <div class="card-head">
      <h2>Accounts</h2>
      <button class="ghost" id="refresh" type="button">Refresh</button>
    </div>
    <input class="search" id="search" type="search" placeholder="Search accounts" aria-label="Search accounts">
    <ul class="accounts" id="accounts"></ul>
  </nav>
  <div class="card detail" id="detail" aria-live="polite">
    <div class="empty">Select an account. Accounts appear here after their first login.</div>
  </div>
</main>

<div id="toast" role="status"></div>

<script>
  const state = { accounts: [], selected: null, busy: false };
  const $ = (id) => document.getElementById(id);

  function el(tag, props = {}, ...children) {
    const node = Object.assign(document.createElement(tag), props);
    for (const child of children.flat()) if (child != null) node.append(child);
    return node;
  }

  async function api(path, options = {}) {
    const response = await fetch(path, options.method === "POST"
      ? { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" }
      : undefined);
    const body = await response.json();
    if (!response.ok) throw new Error(body.errorMessage ?? response.statusText);
    return body;
  }

  let toastTimer;
  function toast(message, error = false) {
    const node = $("toast");
    node.textContent = message;
    node.className = "show" + (error ? " error" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => (node.className = ""), 4000);
  }

  const relative = new Intl.RelativeTimeFormat(undefined, { numeric: "auto" });
  function ago(iso) {
    if (!iso) return "never";
    const seconds = (Date.parse(iso) - Date.now()) / 1000;
    for (const [unit, size] of [["day", 86400], ["hour", 3600], ["minute", 60]]) {
      if (Math.abs(seconds) >= size) return relative.format(Math.round(seconds / size), unit);
    }
    return "just now";
  }

  const tutorialChip = (done) => el("span", { className: "chip " + (done ? "good" : "warn"), textContent: done ? "Tutorial done" : "In tutorial" });
  const stateChip = (questState) => el("span", {
    className: "chip " + ({ Claimed: "good", Completed: "good", Active: "accent" }[questState] ?? ""),
    textContent: questState
  });

  function renderAccounts() {
    const query = $("search").value.trim().toLowerCase();
    const list = state.accounts.filter((a) => !query || a.displayName.toLowerCase().includes(query) || a.id.includes(query));
    $("accounts").replaceChildren(...(list.length ? list.map((account) => el("li", {},
      el("button", {
        type: "button",
        onclick: () => select(account.id),
        ariaCurrent: String(account.id === state.selected)
      },
        el("span", { className: "name", textContent: account.displayName }),
        tutorialChip(account.tutorialCompleted),
        el("span", { className: "sub", textContent: `Last login ${ago(account.lastLogin)}` }))
    )) : [el("li", { className: "empty", textContent: state.accounts.length ? "No matches" : "No accounts yet" })]));
  }

  function table(columns, rows) {
    if (!rows.length) return el("p", { className: "muted", textContent: "Nothing here yet." });
    return el("div", { className: "table-wrap" }, el("table", {},
      el("thead", {}, el("tr", {}, columns.map(([label, , numeric]) => el("th", { textContent: label, className: numeric ? "num" : "" })))),
      el("tbody", {}, rows.map((row) => el("tr", {}, columns.map(([, value, numeric]) => {
        const content = value(row);
        return el("td", { className: numeric ? "num" : "" }, content instanceof Node ? content : String(content ?? "—"));
      }))))));
  }

  function renderDetail(account) {
    const skip = el("button", {
      className: "primary",
      type: "button",
      textContent: account.tutorialCompleted ? "Tutorial done" : "Skip tutorial",
      disabled: account.tutorialCompleted || state.busy,
      onclick: () => skipTutorial(account)
    });

    const progress = (quest) => quest.objectives.map((o) => `${o.progress}/${o.count}`).join(" · ") || "—";

    $("detail").replaceChildren(
      el("div", { className: "detail-head" },
        el("div", {}, el("h1", { textContent: account.displayName }), el("code", { textContent: account.id })),
        skip),
      el("div", { className: "stats" },
        [["Level", account.level ?? "—"], ["Tutorial", tutorialChip(account.tutorialCompleted)],
          ["Homebase", account.homebaseName || "Unnamed"], ["Last login", ago(account.lastLogin)]]
          .map(([label, value]) => el("div", { className: "stat" }, el("div", { className: "label", textContent: label }),
            el("div", { className: "value" }, value instanceof Node ? value : String(value))))),
      el("p", { className: "note", textContent: "Changes apply to the saved profile. Restart the game afterwards so it loads them." }),
      el("section", { className: "block" }, el("h3", { textContent: `Quests (${account.quests.length})` }),
        table([["Quest", (q) => q.questId], ["Type", (q) => q.type], ["State", (q) => stateChip(q.state)], ["Progress", progress]], account.quests)),
      el("section", { className: "block" }, el("h3", { textContent: `Items (${account.items.length})` }),
        table([["Item", (i) => i.templateId], ["Level", (i) => i.level, true], ["Quantity", (i) => i.quantity.toLocaleString(), true]], account.items)),
      el("section", { className: "block" }, el("h3", { textContent: `World items (${account.worldItems.length})` }),
        table([["Item", (i) => i.templateId], ["Quantity", (i) => i.quantity.toLocaleString(), true]], account.worldItems)));
  }

  async function loadAccounts() {
    try {
      state.accounts = await api("/admin/api/accounts");
      renderAccounts();
    } catch (error) {
      toast(error.message, true);
    }
  }

  async function select(accountId) {
    state.selected = accountId;
    renderAccounts();
    try {
      renderDetail(await api(`/admin/api/accounts/${accountId}`));
    } catch (error) {
      toast(error.message, true);
    }
  }

  async function skipTutorial(account) {
    state.busy = true;
    renderDetail(account);
    let result = account;
    try {
      result = await api(`/admin/api/accounts/${account.id}/skip-tutorial`, { method: "POST" });
      toast(`Tutorial skipped for ${result.displayName}. Restart the game to load it.`);
    } catch (error) {
      toast(error.message, true);
    }
    state.busy = false;
    renderDetail(result);
    await loadAccounts();
  }

  $("host").textContent = location.host;
  $("search").addEventListener("input", renderAccounts);
  $("refresh").addEventListener("click", async () => {
    await loadAccounts();
    if (state.selected) await select(state.selected);
  });
  window.addEventListener("focus", loadAccounts);
  loadAccounts();
</script>
</body>
</html>
