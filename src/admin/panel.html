<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Core Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M6 4h20l-4 24H2z' fill='%23ffe74c'/%3E%3C/svg%3E">
<style>
  /* Save the World, 2017: deep blue screens, heavy condensed capitals, yellow call-to-action buttons, rarity colours. */
  :root {
    color-scheme: dark;
    --night: #050b23;
    --deep: #0a1640;
    --panel: rgba(14, 36, 96, .82);
    --panel-solid: #0f2560;
    --panel-raised: #163377;
    --line: rgba(118, 168, 255, .22);
    --line-strong: rgba(118, 168, 255, .45);
    --text: #ffffff;
    --muted: #9fb3e3;
    --sky: #3fb8ff;
    --yellow: #ffe74c;
    --yellow-deep: #f2c21b;
    --ink: #13104a;
    --good: #61d64a;
    --warn: #ffb030;
    --bad: #ff4b55;
    --r-c: #9aa6b2;
    --r-uc: #63c13a;
    --r-r: #3b9cff;
    --r-vr: #b65cf2;
    --r-sr: #f7a032;
    --display: "Burbank Big Condensed", "Burbank Big Cd Bk", "Bebas Neue", "Oswald", "Roboto Condensed", "Arial Narrow", Impact, sans-serif;
    --body: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    font-family: var(--body);
  }
  * { box-sizing: border-box; }
  html { background: var(--night); }
  body {
    margin: 0; min-height: 100vh; color: var(--text); font-size: 14px; line-height: 1.45;
    background:
      radial-gradient(1200px 600px at 75% -10%, rgba(63, 184, 255, .18), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(140, 70, 255, .16), transparent 60%),
      repeating-linear-gradient(135deg, rgba(255, 255, 255, .018) 0 2px, transparent 2px 14px),
      linear-gradient(180deg, var(--deep), var(--night));
    background-attachment: fixed;
  }
  button, input, select { font: inherit; color: inherit; }
  code, .mono { font-family: Consolas, "Cascadia Mono", ui-monospace, monospace; font-size: 12px; }
  .muted { color: var(--muted); }
  h1, h2, h3, .display { font-family: var(--display); font-weight: 900; text-transform: uppercase; letter-spacing: .02em; margin: 0; }
  h1 { font-size: 40px; line-height: 1; font-style: italic; }
  h2 { font-size: 24px; font-style: italic; }
  h3 { font-size: 17px; color: var(--muted); letter-spacing: .06em; }

  /* Top bar */
  .topbar {
    position: sticky; top: 0; z-index: 10; display: flex; align-items: stretch; gap: 8px; height: 64px; padding: 0 24px;
    background: linear-gradient(180deg, rgba(5, 11, 35, .97), rgba(10, 22, 64, .94));
    border-bottom: 2px solid var(--yellow); box-shadow: 0 6px 24px rgba(0, 0, 0, .45);
  }
  .logo { display: flex; align-items: center; gap: 10px; margin-right: 18px; }
  .logo .mark { width: 30px; height: 30px; background: var(--yellow); clip-path: polygon(22% 0, 100% 0, 78% 100%, 0 100%); }
  .logo .word { font-family: var(--display); font-weight: 900; font-size: 30px; font-style: italic; text-transform: uppercase; line-height: 1; }
  .logo .word span { color: var(--yellow); margin-left: 6px; }
  nav.tabs { display: flex; align-items: stretch; gap: 2px; }
  nav.tabs a {
    display: flex; align-items: center; padding: 0 18px; color: var(--muted); text-decoration: none;
    font-family: var(--display); font-weight: 900; font-size: 20px; font-style: italic; text-transform: uppercase; letter-spacing: .03em;
    border-bottom: 4px solid transparent; margin-bottom: -2px;
  }
  nav.tabs a:hover { color: var(--text); }
  nav.tabs a[aria-current="page"] { color: var(--text); border-bottom-color: var(--yellow); text-shadow: 0 0 18px rgba(255, 231, 76, .35); }
  .server { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; white-space: nowrap; min-width: 0; overflow: hidden; }
  .server #server-line { overflow: hidden; text-overflow: ellipsis; }
  html, body { overflow-x: hidden; }
  .pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 0 rgba(97, 214, 74, .7); animation: pulse 2s infinite; }
  .pulse.down { background: var(--bad); animation: none; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 9px rgba(97, 214, 74, 0); } 100% { box-shadow: 0 0 0 0 rgba(97, 214, 74, 0); } }

  main { max-width: 1440px; margin: 0 auto; padding: 24px; }
  .view-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }

  /* Panels with STW's clipped corner */
  .panel {
    background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(6px);
    clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 0 100%);
    padding: 18px; min-width: 0;
  }
  .panel + .panel { margin-top: 16px; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .grid { display: grid; gap: 16px; }
  .grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }

  /* Buttons */
  .btn {
    position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px;
    padding: 0 18px; border: 0; cursor: pointer; transform: skewX(-10deg); white-space: nowrap;
    font-family: var(--display); font-weight: 900; font-size: 17px; text-transform: uppercase; letter-spacing: .03em;
    background: linear-gradient(180deg, #2f7cf0, #1b4fc0); color: #fff; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .25);
    transition: filter .12s, transform .12s;
  }
  .btn > * { transform: skewX(10deg); }
  .btn:hover { filter: brightness(1.15); }
  .btn:active { transform: skewX(-10deg) translateY(1px); }
  .btn.primary { background: linear-gradient(180deg, var(--yellow), var(--yellow-deep)); color: var(--ink); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .18), 0 0 18px rgba(255, 231, 76, .2); }
  .btn.ghost { background: rgba(255, 255, 255, .06); box-shadow: inset 0 0 0 1px var(--line-strong); }
  .btn.danger { background: linear-gradient(180deg, #ff5a63, #c8202c); }
  .btn.small { min-height: 28px; padding: 0 12px; font-size: 14px; }
  .btn:disabled { filter: grayscale(1) brightness(.6); cursor: default; }
  .btn:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  /* Inputs */
  .field {
    min-height: 36px; padding: 6px 12px; background: rgba(3, 9, 30, .7); border: 1px solid var(--line-strong); color: var(--text);
    border-radius: 2px; min-width: 0;
  }
  .field:focus { border-color: var(--yellow); outline: none; }
  .field.num { width: 120px; text-align: right; font-variant-numeric: tabular-nums; }
  .field.tiny { width: 76px; min-height: 28px; padding: 2px 8px; text-align: right; }
  select.field { padding-right: 28px; }
  label.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }

  /* Stat tiles */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .tile {
    position: relative; padding: 14px 16px 12px; background: linear-gradient(160deg, rgba(37, 82, 180, .55), rgba(12, 30, 84, .7));
    border: 1px solid var(--line); clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%);
  }
  .tile .label { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .tile .value { font-family: var(--display); font-weight: 900; font-size: 34px; line-height: 1.1; font-style: italic; margin-top: 4px; overflow-wrap: anywhere; }
  .tile .value small { font-size: 16px; color: var(--muted); font-style: normal; margin-left: 4px; }
  .tile.vbucks .value { color: #bfe6ff; }
  .tile.text .value { font-size: 22px; line-height: 1.25; }
  .tile .value .sub { display: block; font-size: 13px; color: var(--muted); font-style: normal; font-family: var(--body); font-weight: 600; }
  .tile.accent { border-color: rgba(255, 231, 76, .45); }

  /* Chips */
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; font-size: 11px; font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase; background: rgba(255, 255, 255, .08); color: var(--muted); white-space: nowrap; transform: skewX(-10deg); }
  .chip > span { transform: skewX(10deg); }
  .chip.good { color: var(--good); background: rgba(97, 214, 74, .12); }
  .chip.warn { color: var(--warn); background: rgba(255, 176, 48, .12); }
  .chip.bad { color: #fff; background: var(--bad); }
  .chip.sky { color: var(--sky); background: rgba(63, 184, 255, .12); }
  .chip.yellow { color: var(--ink); background: var(--yellow); }

  /* Tables */
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); background: rgba(3, 9, 30, .35); }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
  th { font-family: var(--display); font-weight: 900; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted);
    background: rgba(22, 51, 119, .65); position: sticky; top: 0; }
  tbody tr:hover { background: rgba(63, 184, 255, .06); }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.wrap { white-space: normal; }
  .empty { padding: 36px 16px; text-align: center; color: var(--muted); }

  /* Rarity */
  .rarity { display: inline-block; width: 10px; height: 10px; transform: rotate(45deg); margin-right: 8px; background: var(--r-c); flex: none; }
  .rarity.uc { background: var(--r-uc); } .rarity.r { background: var(--r-r); } .rarity.vr { background: var(--r-vr); } .rarity.sr { background: var(--r-sr); }
  .item-name { display: inline-flex; align-items: center; font-weight: 600; }
  .item-name .tid { margin-left: 8px; color: var(--muted); font-weight: 400; }

  /* Players view */
  .players { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 16px; align-items: start; }
  .roster { position: sticky; top: 88px; max-height: calc(100vh - 112px); display: flex; flex-direction: column; }
  .roster .list { list-style: none; margin: 10px -6px 0; padding: 0; overflow-y: auto; }
  .roster .list button {
    width: 100%; display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; align-items: center; padding: 9px 10px;
    border: 0; background: transparent; cursor: pointer; text-align: left;
  }
  .roster .list button:hover { background: rgba(63, 184, 255, .08); }
  .roster .list button[aria-current="true"] { background: linear-gradient(90deg, rgba(255, 231, 76, .2), rgba(255, 231, 76, 0)); box-shadow: inset 4px 0 0 var(--yellow); }
  .avatar { grid-row: span 2; width: 34px; height: 34px; display: grid; place-items: center; font-family: var(--display); font-weight: 900; font-size: 20px;
    background: linear-gradient(160deg, #3fb8ff, #6b39d6); clip-path: polygon(14% 0, 100% 0, 86% 100%, 0 100%); }
  .roster .name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .roster .sub { grid-column: 2 / -1; color: var(--muted); font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #4a5a86; }
  .dot.on { background: var(--good); box-shadow: 0 0 8px var(--good); }

  .hero-head { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .hero-head .avatar { width: 64px; height: 64px; font-size: 38px; grid-row: auto; }
  .hero-head .who { flex: 1; min-width: 220px; }
  .hero-head .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .subtabs { display: flex; gap: 4px; margin: 18px 0 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .subtabs button {
    border: 0; background: transparent; cursor: pointer; padding: 8px 14px; color: var(--muted);
    font-family: var(--display); font-weight: 900; font-size: 18px; font-style: italic; text-transform: uppercase; border-bottom: 3px solid transparent; margin-bottom: -1px;
  }
  .subtabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--sky); }
  .subtabs button .count { font-size: 13px; color: var(--muted); margin-left: 4px; font-style: normal; }

  .bar { height: 10px; background: rgba(3, 9, 30, .7); border: 1px solid var(--line); overflow: hidden; }
  .bar > div { height: 100%; background: linear-gradient(90deg, var(--sky), #8ee4ff); }
  .bar.rest > div { background: linear-gradient(90deg, #6b39d6, #c58cff); }
  .balance { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; padding: 12px; border: 1px solid var(--line); background: rgba(3, 9, 30, .35); }
  .balance .label { font-weight: 700; }
  .balance .row { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .balance .amount { font-family: var(--display); font-weight: 900; font-size: 26px; font-style: italic; text-align: right; }

  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .filters button { border: 1px solid var(--line-strong); background: rgba(3, 9, 30, .5); padding: 4px 12px; cursor: pointer; transform: skewX(-10deg); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  .filters button > span { display: inline-block; transform: skewX(10deg); }
  .filters button[aria-pressed="true"] { background: var(--sky); color: var(--night); border-color: var(--sky); }

  .catalog { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin-top: 12px; }
  .card {
    position: relative; text-align: left; border: 0; cursor: pointer; padding: 12px 12px 10px; min-height: 86px;
    background: linear-gradient(160deg, rgba(154, 166, 178, .45), rgba(40, 50, 70, .8));
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
    box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .3);
  }
  .card.uc { background: linear-gradient(160deg, rgba(99, 193, 58, .55), rgba(20, 60, 25, .85)); }
  .card.r { background: linear-gradient(160deg, rgba(59, 156, 255, .6), rgba(14, 40, 100, .85)); }
  .card.vr { background: linear-gradient(160deg, rgba(182, 92, 242, .6), rgba(50, 18, 90, .85)); }
  .card.sr { background: linear-gradient(160deg, rgba(247, 160, 50, .65), rgba(95, 45, 10, .85)); }
  .card[aria-pressed="true"] { outline: 3px solid var(--yellow); outline-offset: -3px; }
  .card .t { font-weight: 800; line-height: 1.2; padding-right: 70px; }
  .card .s { font-size: 11px; opacity: .8; margin-top: 4px; overflow-wrap: anywhere; }
  .card .k { position: absolute; right: 10px; top: 8px; font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
  .quick { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }

  .shields { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
  .shield { padding: 16px; border: 1px solid var(--line); background: linear-gradient(160deg, rgba(63, 184, 255, .18), rgba(10, 24, 70, .6)); }
  .shield .lvl { font-family: var(--display); font-weight: 900; font-size: 52px; font-style: italic; line-height: 1; }
  .shield .lvl small { font-size: 20px; color: var(--muted); }
  .pips { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; margin: 10px 0 12px; }
  .pips span { height: 8px; background: rgba(255, 255, 255, .12); transform: skewX(-20deg); }
  .pips span.on { background: var(--yellow); }

  .danger-zone { border-color: rgba(255, 75, 85, .5); background: linear-gradient(160deg, rgba(120, 10, 25, .35), rgba(14, 36, 96, .6)); }
  .danger-zone h2 { color: #ffb3b8; }
  .option-row { display: flex; gap: 16px; flex-wrap: wrap; margin: 10px 0 14px; }

  .log { height: calc(100vh - 360px); min-height: 280px; overflow-y: auto; font-family: Consolas, "Cascadia Mono", ui-monospace, monospace; font-size: 12px;
    background: rgba(2, 6, 20, .85); border: 1px solid var(--line); padding: 8px 0; }
  .log div { padding: 1px 12px; white-space: pre-wrap; word-break: break-all; }
  .log .t { color: #6f84b8; } .log .c { color: var(--yellow); }
  .log .HTTP { color: var(--sky); } .log .XMPP { color: #c58cff; } .log .Matchmaking { color: var(--good); } .log .World, .log .MCP { color: #ffcf66; }

  #toast { position: fixed; right: 24px; bottom: 24px; z-index: 50; max-width: min(460px, calc(100% - 48px)); padding: 12px 18px;
    background: var(--panel-raised); border-left: 4px solid var(--yellow); box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
    opacity: 0; transform: translateY(10px); transition: opacity .15s, transform .15s; pointer-events: none; font-weight: 600; }
  #toast.show { opacity: 1; transform: none; }
  #toast.error { border-left-color: var(--bad); }
  .note { color: var(--muted); font-size: 12px; }

  @media (max-width: 980px) {
    .players { grid-template-columns: minmax(0, 1fr); }
    .roster { position: static; max-height: 360px; }
    .grid.cols-2, .grid.cols-3 { grid-template-columns: 1fr; }
  }
  @media (max-width: 720px) {
    .topbar { height: auto; flex-wrap: wrap; padding: 8px 16px; }
    nav.tabs { width: 100%; overflow-x: auto; scrollbar-width: none; }
    nav.tabs a { padding: 6px 10px; font-size: 17px; flex: none; }
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .tile .value { font-size: 26px; }
    .server { margin-left: 0; width: 100%; }
    main { padding: 16px; }
    h1 { font-size: 30px; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="logo"><div class="mark" aria-hidden="true"></div><div class="word">Core<span>Admin</span></div></div>
  <nav class="tabs" aria-label="Sections">
    <a href="#/dashboard" data-view="dashboard">Dashboard</a>
    <a href="#/players" data-view="players">Players</a>
    <a href="#/sessions" data-view="sessions">Sessions</a>
    <a href="#/logs" data-view="logs">Logs</a>
  </nav>
  <div class="server"><span class="pulse" id="pulse"></span><span id="server-line">Connecting…</span></div>
</header>
<main id="view" aria-live="polite"></main>
<div id="toast" role="status"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const state = { view: "dashboard", accounts: [], account: null, accountId: null, tab: "overview", inventoryProfile: "items",
  inventoryCategory: "", inventorySearch: "", catalog: { search: "", category: "", items: [], categories: [], picked: null },
  logs: [], logAfter: 0, logPaused: false, logFilter: "", logCategory: "", timers: [] };

function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props ?? {})) {
    if (value === undefined || value === null || value === false) continue;
    if (key === "class") node.className = value;
    else if (key === "text") node.textContent = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else if (key in node && typeof value !== "string") node[key] = value;
    else node.setAttribute(key, value === true ? "" : value);
  }
  for (const child of children.flat(Infinity)) if (child !== null && child !== undefined && child !== false) node.append(child instanceof Node ? child : String(child));
  return node;
}
const btn = (label, onclick, kind = "", extra = {}) => el("button", { type: "button", class: `btn ${kind}`, onclick, ...extra }, el("span", { text: label }));
const chip = (label, kind = "") => el("span", { class: `chip ${kind}` }, el("span", { text: label }));
const fmt = (number) => Number(number ?? 0).toLocaleString();
const kinds = { heroes: "Heroes", schematics: "Schematics", survivors: "Survivors", leads: "Lead survivors", defenders: "Defenders", llamas: "Llamas",
  vouchers: "Vouchers", resources: "Resources", consumables: "Consumables", transform: "Transform keys", expeditions: "Expeditions",
  stormshields: "Storm shields", skilltree: "Skill tree", banners: "Banners", quests: "Quests", world: "Backpack and storage", other: "Other" };
const kindLabel = (key) => kinds[key] ?? key;

async function api(path, body) {
  const response = await fetch(path, body === undefined ? undefined : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.errorMessage ?? `${response.status} ${response.statusText}`);
  return data;
}

let toastTimer;
function toast(message, error = false) {
  const node = $("toast");
  node.textContent = message;
  node.className = "show" + (error ? " error" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (node.className = ""), 4200);
}
async function act(promise, success) {
  try {
    const result = await promise;
    if (success) toast(typeof success === "function" ? success(result) : success);
    return result;
  } catch (error) {
    toast(error.message, true);
    return null;
  }
}

const relative = new Intl.RelativeTimeFormat(undefined, { numeric: "auto" });
function ago(iso) {
  if (!iso) return "never";
  const seconds = (Date.parse(iso) - Date.now()) / 1000;
  for (const [unit, size] of [["day", 86400], ["hour", 3600], ["minute", 60]]) {
    if (Math.abs(seconds) >= size) return relative.format(Math.round(seconds / size), unit);
  }
  return "just now";
}
function duration(seconds) {
  const d = Math.floor(seconds / 86400), h = Math.floor(seconds % 86400 / 3600), m = Math.floor(seconds % 3600 / 60);
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m ${seconds % 60}s`;
}
const initial = (name) => (name || "?").trim()[0]?.toUpperCase() ?? "?";

function table(columns, rows, empty = "Nothing here yet.") {

  for (const timer of state.timers) clearInterval(timer);
  state.timers = [];
  const next = ["dashboard", "players", "sessions", "logs"].includes(view) ? view : "dashboard";
  if (next !== state.view || !$("view").childElementCount) $("view").replaceChildren(el("div", { class: "empty", text: "Loading…" }));
  state.view = next;
  for (const link of document.querySelectorAll("nav.tabs a")) link.setAttribute("aria-current", link.dataset.view === state.view ? "page" : "false");
  if (state.view === "players") {
    if (accountId && accountId !== state.accountId) { state.accountId = accountId; state.account = null; }
    if (!accountId) { state.accountId = null; state.account = null; }

}

      el("p", { class: "note", text: "Kick revokes every token and closes XMPP and STOMP: the game drops to the login screen. A ban also refuses future logins." }),
      a.banned
        ? el("div", { class: "actions" }, chip(`Banned ${ago(a.banned.at)}${a.banned.reason ? ": " + a.banned.reason : ""}`, "bad"), btn("Unban", () => post("unban", {}, `${a.displayName} unbanned`), "primary"))
        : el("div", { class: "actions" }, reason, btn("Ban", () => confirm(`Ban ${a.displayName}?`) && post("ban", { reason: reason.value }, `${a.displayName} banned`), "danger"),
          btn("Kick", () => post("kick", {}, `${a.displayName} was logged out`), "ghost"))),
    el("section", { class: "panel" }, el("h2", { text: "Profiles on disk" }),
      el("p", { class: "note", text: `Saved: ${a.profiles.join(", ") || "none yet"}. A reset deletes the chosen profiles; the next login makes them fresh, like a new account. The player is logged out first.` }),
      el("div", { class: "option-row" }, profileBoxes),
      el("div", { class: "actions" },
        btn("Reset selected", () => {
          const chosen = profileBoxes.map((box) => box.querySelector("input")).filter((box) => box.checked).map((box) => box.value);
          if (!chosen.length) return toast("Tick at least one profile", true);
          if (confirm(`Reset ${chosen.join(", ")} for ${a.displayName}? This can't be undone.`)) post("reset", { profiles: chosen }, "Profiles reset");
        }, "danger"),
        btn("Reset everything", () => confirm(`Wipe all of ${a.displayName}'s progress? This can't be undone.`) && post("reset", { profiles: "all" }, "Progress wiped"), "danger"))),
    el("section", { class: "panel danger-zone" }, el("h2", { text: "Delete account" }),
      el("p", { class: "note", text: "Removes the account, its profiles, friends and cloud saves. Logging in with the same name later makes a new, empty account." }),
      el("div", { class: "actions" }, confirmName, btn("Delete", async () => {
        const result = await act(api(`/admin/api/accounts/${a.id}/delete`, { confirm: confirmName.value }));
        if (!result) return;
        toast(`${a.displayName} deleted`);
        state.account = null;
        location.hash = "#/players";
      }, "danger"))));
}

/* ---------- sessions ---------- */
function sessionTable(sessions, withActions = true) {
  return table([
    ["Server", (s) => [el("strong", { text: s.serverName || s.ownerName || "—" }), el("div", { class: "note mono", text: s.id })]],
    ["Address", (s) => el("span", { class: "mono", text: `${s.serverAddress}:${s.serverPort}` })],
    ["Mode", (s) => chip(s.gameMode || "—", s.gameMode === "FORTEMPTY" ? "good" : "yellow")],
    ["Region", (s) => s.region || "—"],
    ["Players", (s) => (s.players ? s.players.map((p) => p.displayName).join(", ") : `${s.currentPlayers}`) || "—", "wrap"],
    ["Beacon", (s) => s.beaconPort || "—", "num"],
    ["State", (s) => chip(s.started ? "Started" : s.currentPlayers ? "Busy" : "Free", s.started ? "yellow" : s.currentPlayers ? "warn" : "good")],
    ["Heartbeat", (s) => ago(s.lastUpdated)],
    ...(withActions ? [["", (s) => btn("End", async () => {
      if (!confirm(`End session ${s.serverName || s.id}? It leaves matchmaking; the server notices at its next heartbeat.`)) return;
      if (await act(api(`/admin/api/sessions/${s.id}/end`, {}), "Session ended")) showSessions();
    }, "danger small")]] : [])
  ], sessions, "No game sessions. Servers register when they start.");
}

async function showSessions() {
  const sessions = await act(api("/admin/api/sessions"));
  if (!sessions || state.view !== "sessions") return;
  $("view").replaceChildren(
    el("div", { class: "view-head" }, el("div", {}, el("h1", { text: "Game sessions" }),
      el("div", { class: "muted", text: "Servers registered through /fortnite/api/matchmaking/session. Refreshes every 5 seconds." })),
      el("div", { class: "actions" }, btn("Refresh", showSessions, "ghost"))),
    el("div", { class: "tiles", style: "margin-bottom:16px" },
      tile("Sessions", fmt(sessions.length), "accent"),
      tile("Free servers", fmt(sessions.filter((s) => s.gameMode === "FORTEMPTY" && !s.currentPlayers).length)),
      tile("Players in game", fmt(sessions.reduce((total, s) => total + s.currentPlayers, 0)))),
    el("section", { class: "panel" }, sessionTable(sessions)));
  if (!state.timers.length) every(5000, () => state.view === "sessions" && showSessions());
}

/* ---------- logs ---------- */
async function pullLogs() {
  if (state.logPaused) return;
  const lines = await api(`/admin/api/logs?after=${state.logAfter}`).catch(() => null);
  if (!lines?.length) return;
  state.logAfter = lines[lines.length - 1].seq;
  state.logs.push(...lines);
  if (state.logs.length > 2000) state.logs.splice(0, state.logs.length - 2000);
  renderLogLines();
}
function renderLogLines() {
  const box = $("log");
  if (!box) return;
  const query = state.logFilter.toLowerCase();
  const stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
  const shown = state.logs.filter((line) => (!state.logCategory || line.category === state.logCategory) && (!query || line.message.toLowerCase().includes(query)));
  box.replaceChildren(...shown.slice(-800).map((line) => el("div", { class: line.category },
    el("span", { class: "t", text: new Date(line.at).toLocaleTimeString() }), " ", el("span", { class: "c", text: `[${line.category}]` }), " ", line.message)));
  if (stick) box.scrollTop = box.scrollHeight;
}
async function showLogs() {
  const categories = ["", "HTTP", "Core", "XMPP", "STOMP", "Matchmaking", "MCP", "World", "Items"];
  const filter = el("input", { class: "field", type: "search", placeholder: "Filter messages", value: state.logFilter, style: "flex:1 1 260px" });
  filter.addEventListener("input", () => { state.logFilter = filter.value; renderLogLines(); });
  const category = el("select", { class: "field", "aria-label": "Category" }, categories.map((c) => el("option", { value: c, text: c || "Every category", selected: state.logCategory === c })));
  category.addEventListener("change", () => { state.logCategory = category.value; renderLogLines(); });
  const pause = btn(state.logPaused ? "Resume" : "Pause", () => { state.logPaused = !state.logPaused; pause.firstChild.textContent = state.logPaused ? "Resume" : "Pause"; }, "ghost");
  const unknown = await act(api("/admin/api/unknown")) ?? [];
  if (state.view !== "logs") return;
  $("view").replaceChildren(
    el("div", { class: "view-head" }, el("div", {}, el("h1", { text: "Logs" }), el("div", { class: "muted", text: "The backend's console since it started (the last 2,000 lines), live." })),
      el("div", { class: "actions" }, filter, category, pause, btn("Clear view", () => { state.logs = []; renderLogLines(); }, "ghost"))),
    el("section", { class: "panel" }, el("div", { class: "log", id: "log" })),
    el("section", { class: "panel" }, el("div", { class: "panel-head" }, el("h2", { text: "Unanswered requests" })),
      table([["When", (u) => `${new Date(u.time).toLocaleString()} (${ago(u.time)})`], ["Kind", (u) => u.kind ?? "route"], ["Method", (u) => u.method],
        ["Host", (u) => u.host ?? "—"], ["Path", (u) => el("span", { class: "mono", text: u.url ?? u.path })]], unknown, "Every request so far had an answer.")));
  renderLogLines();
  await pullLogs();
  every(2000, pullLogs);
}

/* ---------- header status ---------- */
async function heartbeat() {
  try {
    const o = await api("/admin/api/overview");
    $("pulse").className = "pulse";
    $("server-line").textContent = `${location.host} · ${o.online.length} online · ${o.sessions.length} sessions · up ${duration(o.uptimeSeconds)}`;
  } catch {
    $("pulse").className = "pulse down";
    $("server-line").textContent = `${location.host} · not answering`;
  }
}
setInterval(heartbeat, 10000);
heartbeat();
route();
</script>
</body>
</html>
